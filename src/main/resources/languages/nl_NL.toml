# GamemodeSwitcher — nl_NL
#
# === Bestand bewerken ===
# plugins/GamemodeSwitcher/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /gsw language server edit nl_NL
#
# === Voorvoegsel ===
# {prefix}  de globale waarde runtime.prefix. Verwijder {prefix} uit één bericht om het alleen daar te verbergen
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
# Zet een backslash voor & of [ om het teken letterlijk weer te geven.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {added}  Berichten toegevoegd door een taalupdate
#   {after}  Waarde na de wijziging
#   {argument}  Onverwacht opdrachtargument
#   {before}  Waarde vóór de wijziging
#   {command}  Opdrachtpad
#   {count}  Aantal overeenkomstige vermeldingen
#   {enabled}  Status van het wisselen van spelmodus
#   {folder}  Naam van de wereldmap
#   {group}  Naam van de berichtcategorie
#   {hot_reload}  Status van het automatisch herladen van bestanden
#   {java}  Vereiste Java-versie
#   {kept}  Lokale bewerkingen behouden door een taalupdate
#   {key}  Parameter- of berichtsleutel
#   {language}  Servertaal
#   {line}  Regelnummer van het bericht
#   {locale}  Taalcode
#   {maximum}  Maximaal toegestane waarde
#   {minecraft}  Ondersteund Minecraft-versiebereik
#   {mode}  Naam van de spelmodus
#   {new}  Nieuwe waarde van de instelling
#   {number}  Nummer van de lijstvermelding
#   {old}  Vorige waarde van de instelling
#   {page}  Huidig paginanummer
#   {pages}  Totaal aantal pagina’s
#   {parameter}  Parameternaam
#   {path}  Lokaal pad van het diagnoserapport
#   {permission}  Vereiste machtiging
#   {personal}  Persoonlijke taal, als die afwijkt van de serverstandaard
#   {plugin}  Pluginnaam
#   {prefix}  Globale waarde van runtime.prefix; optioneel per bericht
#   {reason}  Reden van de fout
#   {remaining}  Resterende tijd tot de volgende taalcontrole
#   {scheduler}  Implementatie van de planner
#   {seconds}  Resterende wacht- of bevestigingstijd in seconden
#   {section}  Onderdeel van de taaleditor
#   {setting}  Naam van de instelling
#   {sound}  Geluidssleutel met naamruimte
#   {state}  Gebaren- of meldingsinstelling van de speler
#   {step}  Verandering van een getal door één gewone klik
#   {target}  Doel van de taalkeuze
#   {type}  Parametertype
#   {updated}  Berichten gewijzigd door een taalupdate
#   {url}  Openbare URL van het diagnoserapport
#   {value}  Huidige, standaard- of ruwe waarde
#   {variables}  Geldige variabelen voor het geselecteerde bericht
#   {version}  Pluginversie
#   {world}  Wereldnaam

