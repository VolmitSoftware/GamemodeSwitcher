# GamemodeSwitcher — nl_NL
#
# === Bestand bewerken ===
# plugins/GamemodeSwitcher/languages/nl_NL.toml
# Je kunt dit bestand rechtstreeks bewerken. Lokale wijzigingen blijven behouden; ontbrekende of ongeldige vermeldingen gebruiken het ingebouwde Engels.
# /gsw language server edit nl_NL
#
# === Voorvoegsel ===
# {prefix}  de globale waarde runtime.prefix. Verwijder {prefix} uit één bericht om het alleen daar te verbergen
#
# === Opmaak ===
# Kleuren: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B en [RRGGBB]. MiniMessage blijft beschikbaar voor eigen opmaak.
# Zet een backslash voor & of [ om het teken letterlijk weer te geven.
#
# === Variabelen ===
# Behoud de namen van variabelen en gebruik alleen de variabelen die bij het bericht horen.
#   {after}  Waarde na de wijziging
#   {argument}  onverwacht argument
#   {before}  Waarde vóór de wijziging
#   {command}  opdrachtpad
#   {count}  Aantal overeenkomstige vermeldingen
#   {enabled}  Status van het wisselen van spelmodus
#   {group}  Categorie in de taaleditor
#   {hot_reload}  hot-reloadstatus
#   {key}  parametersleutel
#   {language}  actieve taal
#   {line}  Bronregel of regelnummer
#   {locale}  landinstelling
#   {maximum}  Maximaal toegestane waarde
#   {mode}  Naam van de spelmodus
#   {new}  nieuwe waarde
#   {number}  Nummer van de vermelding
#   {old}  vorige waarde
#   {page}  Huidige pagina
#   {pages}  Totaal aantal pagina’s
#   {parameter}  parameternaam
#   {path}  lokaal rapportpad
#   {permission}  vereiste machtiging
#   {personal}  persoonlijke landinstelling
#   {plugin}  Pluginnaam
#   {prefix}  de globale waarde runtime.prefix. Verwijder {prefix} uit één bericht om het alleen daar te verbergen
#   {reason}  foutreden
#   {sound}  Geluidsleutel
#   {scheduler}  planner
#   {seconds}  Resterende wacht- of bevestigingstijd in seconden
#   {section}  Onderdeel van de taaleditor
#   {setting}  instellingsnaam
#   {step}  Verandering van een getal door één gewone klik
#   {state}  Persoonlijke gebaren- of meldingsstatus
#   {target}  Doelspeler, entiteit of waarde
#   {type}  type
#   {url}  openbare URL
#   {value}  huidige, standaard- of ruwe waarde
#   {variables}  geldige tijdelijke aanduidingen
#   {version}  pluginversie
#   {world}  wereld

