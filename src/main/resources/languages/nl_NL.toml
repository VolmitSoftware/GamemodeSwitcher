description = "Geluid na een geslaagde spelmoduswissel."
input = "Voer een geluidssleutel met naamruimte in, zoals minecraft:ui.button.click of minecraft:entity.experience_orb.pickup. Sleutels van aangepaste resourcepacks zijn toegestaan."

[gui.config.feedback.sound-volume]
name = "Volume"
description = "Volume van het wisselgeluid. Bereik: 0 tot 1; 0 is stil."

[gui.config.feedback.sound-pitch]
name = "Toonhoogte"
description = "Toonhoogte van het wisselgeluid. Bereik: 0.5 tot 2; 1 gebruikt de oorspronkelijke toonhoogte."

[spectator]
save-failed = "{prefix}&cJe sessie kon niet worden opgeslagen. Je spelmodus is niet gewijzigd.&r"
return-failed = "{prefix}&cTerugkeren is mislukt. Je sessie is opgeslagen; probeer /gsw return opnieuw.&r"
none = "{prefix}&cJe hebt geen actieve toeschouwersessie.&r"
busy = "{prefix}&cEr loopt al een wisseling van toeschouwermodus.&r"

[gui.config.spectator]
description = "Kies terugkeer naar de vorige modus en beginlocatie."
name = "Toeschouwersessies"

[gui.config.spectator.restore-previous-mode]
description = "Keer bij het verlaten van je toeschouwersessie terug naar je vorige modus."
name = "Vorige modus herstellen"

[gui.config.spectator.return-to-origin]
description = "Keer terug naar de opgeslagen beginlocatie voordat je een door de plugin gestarte toeschouwersessie verlaat."
name = "Terug naar beginlocatie"

[sound.menu]
custom-help = "<gray>Voer een geluidsleutel van Minecraft of een resourcepack in.</gray>"
custom = "<gray>Aangepaste geluidsleutel</gray>"
preview-help = "<gray>Luister met het huidige servervolume en de toonhoogte, ook als wisselgeluiden gedempt zijn.</gray>"
preview = "<gray>Huidig geluid beluisteren</gray>"
selected = "<gray>Geselecteerd geluid</gray>"
select = "<gray>Linksklik om te kiezen. Rechtsklik om te beluisteren.</gray>"
current = "<gray>Huidig geluid: {sound}</gray>"
title = "<gradient:#634514:#2f523f>Wisselgeluid</gradient>"

[sound.preset]
bell = "<gray>Bel</gray>"
experience = "<gray>Ervaring oppakken</gray>"
pling = "<gray>Plingtoon</gray>"
chime = "<gray>Klank</gray>"
click = "<gray>Knopklik</gray>"

[gui.config.spectator.allow-unsafe-return]
name = "Onveilig terugkeren toestaan"
description = "Keer terug zonder vloer of vrije ruimte te controleren. Standaard aan; zet uit om een veilige bestemming te eisen. Geldt ook voor actieve sessies."
