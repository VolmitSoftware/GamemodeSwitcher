# GamemodeSwitcher — fr_FR
#
# === Modifier le fichier ===
# plugins/GamemodeSwitcher/languages/fr_FR.toml
# Ce fichier peut être modifié directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l’anglais intégré.
# /gsw language server edit fr_FR
#
# === Préfixe ===
# {prefix}  la valeur globale runtime.prefix. Retirez {prefix} d’un message pour le masquer uniquement à cet endroit
#
# === Mise en forme ===
# Couleurs : &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B et [RRGGBB]. MiniMessage reste disponible pour les formats personnalisés.
# Ajoutez une barre oblique inverse devant & ou [ pour l’afficher littéralement.
#
# === Variables ===
# Conservez les noms des variables et utilisez uniquement celles du message concerné.
#   {added}  Messages ajoutés par une mise à jour de langue
#   {after}  Valeur après le changement
#   {argument}  Argument de commande inattendu
#   {before}  Valeur avant le changement
#   {command}  Chemin de la commande
#   {count}  Nombre d’entrées correspondantes
#   {enabled}  État du changement de mode de jeu
#   {folder}  Nom du dossier du monde
#   {group}  Nom de la catégorie de messages
#   {hot_reload}  État du rechargement automatique des fichiers
#   {java}  Version de Java requise
#   {kept}  Modifications locales conservées par une mise à jour de langue
#   {key}  Clé de paramètre ou de message
#   {language}  Langue du serveur
#   {line}  Numéro de ligne du message
#   {locale}  Identifiant de langue
#   {maximum}  Valeur maximale autorisée
#   {minecraft}  Plage de versions de Minecraft prises en charge
#   {mode}  Nom du mode de jeu
#   {new}  Nouvelle valeur du réglage
#   {number}  Numéro de l’entrée
#   {old}  Ancienne valeur du réglage
#   {page}  Page actuelle
#   {pages}  Nombre total de pages
#   {parameter}  Nom du paramètre
#   {path}  Chemin local du rapport de diagnostic
#   {permission}  Permission requise
#   {personal}  Langue personnelle si elle diffère de celle du serveur
#   {plugin}  Nom du plugin
#   {prefix}  Valeur globale de runtime.prefix ; facultative pour chaque message
#   {reason}  Motif de l’échec
#   {remaining}  Délai restant avant la prochaine vérification des langues
#   {scheduler}  Implémentation du planificateur
#   {seconds}  Temps restant de recharge ou de confirmation en secondes
#   {section}  Section de l’éditeur de langues
#   {setting}  Nom du réglage
#   {sound}  Identifiant de son avec espace de noms
#   {state}  Réglage de gestes ou de notifications du joueur
#   {step}  Variation d’un réglage numérique lors d’un clic normal
#   {target}  Cible de la sélection de langue
#   {type}  Type de paramètre
#   {updated}  Messages modifiés par une mise à jour de langue
#   {url}  URL publique du rapport de diagnostic
#   {value}  Valeur actuelle, par défaut ou brute
#   {variables}  Variables valides pour le message sélectionné
#   {version}  Version du plugin
#   {world}  Nom du monde

