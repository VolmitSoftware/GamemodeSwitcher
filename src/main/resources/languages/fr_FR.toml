name = "Alerte de barre d’action"
description = "Afficher le nouveau mode au-dessus de la barre rapide, avec une indication de sortie en mode Spectateur."

[gui.config.feedback.title-enabled]
name = "Alerte de titre"
description = "Afficher le nouveau mode au centre de l’écran, avec une indication de sortie en mode Spectateur."

[gui.config.feedback.popup-duration-ticks]
name = "Durée des alertes"
description = "Durée du titre et de la barre d’action en ticks ; 20 ticks = 1 seconde. Plage : 1 à 200."

[gui.config.feedback.sound]
name = "Clé de son"
description = "Son joué après un changement de mode réussi."
input = "Saisissez une clé de son avec espace de noms, comme minecraft:ui.button.click ou minecraft:entity.experience_orb.pickup. Les clés personnalisées de packs de ressources sont autorisées."

[gui.config.feedback.sound-volume]
name = "Volume"
description = "Volume du son de changement. Plage : 0 à 1 ; 0 est silencieux."

[gui.config.feedback.sound-pitch]
name = "Hauteur du son"
description = "Hauteur du son de changement. Plage : 0.5 à 2 ; 1 utilise la hauteur d’origine."

