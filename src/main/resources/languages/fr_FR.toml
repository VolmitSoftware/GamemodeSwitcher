[gui.config.spectator]
name = "Retour du mode Spectateur"
description = "Rétablir le mode ou la position enregistrés lorsque ce plugin lance une session spectateur."

[gui.config.spectator.restore-previous-mode]
name = "Rétablir le mode précédent"
description = "Appuyez trois fois sur S’accroupir ou utilisez /gsw return pour rétablir le mode depuis lequel vous êtes passé en Spectateur. Les permissions et restrictions de mondes actuelles s’appliquent toujours."

[gui.config.spectator.return-to-origin]
name = "Revenir au point de départ"
description = "Revenir à la position d’entrée enregistrée avant de quitter une session spectateur lancée par le plugin."

[gui.config.spectator.allow-unsafe-return]
