[gui.config.feedback.sound-enabled]
name = "Som de mudança"
description = "Reproduzir um som de confirmação após uma mudança de modo bem-sucedida."

[gui.config.diagnostics.upload-enabled]
name = "Envios públicos de diagnóstico"
description = "Permitir que os relatórios de diagnóstico sejam enviados publicamente. Usa upload=false para guardar um relatório localmente."

[gui.config.feedback.chat-enabled]
name = "Mensagens no chat"
description = "Mostrar mudanças bem-sucedidas e dicas de Espectador no chat. Quando desativado, os motivos de falha aparecem na barra de ação."

[gui.config.feedback.action-bar-enabled]
name = "Aviso na barra de ação"
description = "Mostrar o novo modo acima da barra rápida, com uma dica de saída em Espectador."

[gui.config.feedback.title-enabled]
name = "Aviso de título"
description = "Mostrar o novo modo no centro do ecrã, com uma dica de saída em Espectador."

[gui.config.feedback.popup-duration-ticks]
name = "Duração dos avisos"
description = "Duração do título e da barra de ação em ticks; 20 ticks = 1 segundo. Intervalo: 1 a 200."

[gui.config.feedback.sound]
name = "Chave de som"
description = "Som a reproduzir após uma mudança de modo bem-sucedida."
input = "Introduz uma chave de som com espaço de nomes, como minecraft:ui.button.click ou minecraft:entity.experience_orb.pickup. São permitidas chaves de pacotes de recursos personalizados."

[gui.config.feedback.sound-volume]
name = "Volume do som"
description = "Volume do som de mudança. Intervalo: 0 a 1; 0 é silêncio."

[gui.config.feedback.sound-pitch]
name = "Tom do som"
description = "Tom do som de mudança. Intervalo: 0.5 a 2; 1 usa o tom original."

[spectator]
save-failed = "{prefix}&cNão foi possível guardar a tua sessão de Espectador. O teu modo de jogo não foi alterado.&r"
return-failed = "{prefix}&cNão foi possível regressar. A sessão está guardada; tenta /gsw return novamente.&r"
origin-missing = "{prefix}&eO mundo onde entraste em Espectador já não está carregado, por isso o modo de jogo mudou onde estás.&r"
none = "{prefix}&eNão tens uma sessão de Espectador ativa.&r"
busy = "{prefix}&eJá está em curso uma transição de Espectador.&r"

[gui.config.spectator]
description = "Restaurar o modo ou a posição registados quando este plugin inicia uma sessão de Espectador."
name = "Regresso de Espectador"

[gui.config.spectator.restore-previous-mode]
description = "Agacha-te três vezes ou usa /gsw return para restaurar o modo a partir do qual entraste em Espectador. As permissões atuais e as restrições de mundos continuam a aplicar-se."
name = "Restaurar modo anterior"

[gui.config.spectator.return-to-origin]
description = "Regressar à posição de entrada guardada antes de sair de uma sessão de Espectador iniciada pelo plugin."
name = "Regressar à posição inicial"

[sound.menu]
custom-help = "<gray>Introduz uma chave de som do Minecraft ou de um pacote de recursos.</gray>"
custom = "<gold>Chave de som personalizada</gold>"
preview-help = "<gray>Ouve este som com o volume e o tom atuais do servidor. A pré-visualização funciona mesmo com os sons de mudança silenciados.</gray>"
preview = "<gold>Ouvir o som atual</gold>"
selected = "<green>Som selecionado</green>"
select = "<gray>Clica com o botão esquerdo para usar. Clica com o botão direito para ouvir.</gray>"
current = "<gray>Som atual: <white>{sound}</white></gray>"
title = "<gradient:#634514:#2f523f>Som da mudança</gradient>"

[sound.preset]
bell = "<gold>Sino</gold>"
experience = "<gold>Recolha de experiência</gold>"
pling = "<gold>Pling</gold>"
chime = "<gold>Carrilhão</gold>"
click = "<gold>Clique de botão</gold>"

[world.menu]
title = "<gradient:#634514:#2f523f>Mundos desativados</gradient>"
help = "<gold>Mundos desativados</gold>"
help-detail = "<gray>Clica num mundo para desativar ou ativar aí a mudança de modo de jogo. Os mundos são guardados pela chave de dimensão, como minecraft:the_nether.</gray>"
folder = "<gray>Pasta do mundo: <white>{folder}</white></gray>"
unloaded = "<gray>Não carregado neste servidor</gray>"
disabled = "<red>Mudança desativada</red>"
enabled = "<green>Mudança ativada</green>"
disable = "<gray>Clica para desativar a mudança aqui.</gray>"
enable = "<gray>Clica para voltar a ativar a mudança aqui.</gray>"
remove = "<gray>Clica para o remover da lista.</gray>"

[gui.config.spectator.allow-unsafe-return]
name = "Permitir regressos inseguros"
description = "Permitir regressos sem verificar o chão ou o espaço livre. Ativo por predefinição; desativa para exigir um destino seguro. Aplica-se também a sessões ativas."

[gui.config.general.update-notifications]
name = "Notificações de atualização"
description = "Verificar versões no GitHub e notificar os jogadores autorizados através do aviso de atualização partilhado da Volmit. Não são instaladas atualizações."
