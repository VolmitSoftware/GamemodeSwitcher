# GamemodeSwitcher — pt_PT
#
# === Editar o ficheiro ===
# plugins/GamemodeSwitcher/languages/pt_PT.toml
# Pode editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /gsw language server edit pt_PT
#
# === Prefixo ===
# {prefix}  o valor global runtime.prefix. Remove {prefix} de uma mensagem para o ocultar apenas aí
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
# Coloca uma barra inversa antes de & ou [ para apresentar o carácter literalmente.
#
# === Variáveis ===
# Mantenha os nomes das variáveis e use apenas as que pertencem a cada mensagem.
#   {after}  Valor após a alteração
#   {argument}  argumento inesperado
#   {before}  Valor antes da alteração
#   {command}  caminho do comando
#   {count}  Número de itens correspondentes
#   {enabled}  Estado da mudança de modo de jogo
#   {group}  Categoria do editor de idiomas
#   {hot_reload}  estado do recarregamento
#   {key}  chave do parâmetro
#   {language}  idioma ativo
#   {line}  Linha de origem ou número de linha
#   {locale}  região
#   {maximum}  Valor máximo autorizado
#   {mode}  Nome do modo de jogo
#   {new}  valor novo
#   {number}  Número da entrada
#   {old}  valor anterior
#   {page}  Página atual
#   {pages}  Número total de páginas
#   {parameter}  nome do parâmetro
#   {path}  caminho do relatório local
#   {permission}  permissão necessária
#   {personal}  região pessoal
#   {plugin}  Nome do plug-in
#   {prefix}  o valor global runtime.prefix. Remove {prefix} de uma mensagem para o ocultar apenas aí
#   {reason}  motivo da falha
#   {scheduler}  agendador
#   {seconds}  Tempo de espera ou confirmação restante em segundos
#   {section}  Secção do editor de idiomas
#   {setting}  nome da definição
#   {step}  Alteração de um valor numérico com um clique normal
#   {state}  Estado pessoal dos gestos ou notificações
#   {target}  Jogador alvo, entidade ou valor
#   {type}  tipo
#   {url}  URL público
#   {value}  valor atual, predefinido ou bruto
#   {variables}  marcadores válidos
#   {version}  versão do plugin
#   {world}  mundo

