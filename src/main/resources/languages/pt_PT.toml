# GamemodeSwitcher — pt_PT
#
# === Editar o ficheiro ===
# plugins/GamemodeSwitcher/languages/pt_PT.toml
# Podes editar este ficheiro diretamente. As alterações locais são preservadas; as entradas em falta ou inválidas usam o inglês incorporado.
# /gsw language server edit pt_PT
#
# === Prefixo ===
# {prefix}  o valor global runtime.prefix. Remove {prefix} de uma mensagem para o ocultar apenas aí
#
# === Formatação ===
# Cores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. O MiniMessage continua disponível para formatação personalizada.
# Coloca uma barra inversa antes de & ou [ para apresentar o carácter literalmente.
#
# === Variáveis ===
# Mantém os nomes das variáveis e usa apenas as que pertencem a cada mensagem.
#   {added}  Mensagens adicionadas por uma atualização de idioma
#   {after}  Valor após a alteração
#   {argument}  Argumento de comando inesperado
#   {before}  Valor antes da alteração
#   {command}  Caminho do comando
#   {count}  Número de entradas correspondentes
#   {enabled}  Estado da mudança de modo de jogo
#   {folder}  Nome da pasta do mundo
#   {group}  Nome da categoria de mensagens
#   {hot_reload}  Estado do recarregamento automático de ficheiros
#   {java}  Versão do Java necessária
#   {kept}  Edições locais mantidas por uma atualização de idioma
#   {key}  Chave do parâmetro ou da mensagem
#   {language}  Idioma do servidor
#   {line}  Número da linha da mensagem
#   {locale}  Identificador do idioma
#   {maximum}  Valor máximo autorizado
#   {minecraft}  Intervalo de versões do Minecraft suportadas
#   {mode}  Nome do modo de jogo
#   {new}  Novo valor da definição
#   {number}  Número da entrada da lista
#   {old}  Valor anterior da definição
#   {page}  Número da página atual
#   {pages}  Número total de páginas
#   {parameter}  Nome do parâmetro
#   {path}  Caminho local do relatório de diagnóstico
#   {permission}  Permissão necessária
#   {personal}  Idioma pessoal, quando diferente do predefinido do servidor
#   {plugin}  Nome do plugin
#   {prefix}  Valor global de runtime.prefix; opcional em cada mensagem
#   {reason}  Motivo da falha
#   {remaining}  Tempo restante até à próxima verificação de idiomas
#   {scheduler}  Implementação do agendador
#   {seconds}  Tempo de espera ou confirmação restante em segundos
#   {section}  Secção do editor de idiomas
#   {setting}  Nome da definição
#   {sound}  Identificador de som com espaço de nomes
#   {state}  Definição de gestos ou de avisos do jogador
#   {step}  Alteração de um valor numérico com um clique normal
#   {target}  Destino da seleção de idioma
#   {type}  Tipo do parâmetro
#   {updated}  Mensagens alteradas por uma atualização de idioma
#   {url}  URL público do relatório de diagnóstico
#   {value}  Valor atual, predefinido ou bruto
#   {variables}  Variáveis válidas para a mensagem selecionada
#   {version}  Versão do plugin
#   {world}  Nome do mundo

