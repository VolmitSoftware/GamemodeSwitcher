[gui.config.general.language]
name = "Язык сервера"
description = "Язык по умолчанию для игроков без личного выбора. Отсутствующие переводы заменяются английскими."

[gui.config.metrics.enabled]
name = "Анонимная статистика"
description = "Отправлять анонимную статистику bStats. Общий отказ от bStats также учитывается."

[gui.config.gestures.double-tap-millis]
name = "Интервал двойного нажатия"
description = "Максимальное время между нажатиями клавиши «Заменить предмет во второй руке» в миллисекундах. Диапазон: от 100 до 3000."

[gui.config.gestures.sneak-tap-millis]
name = "Интервал нажатий в режиме наблюдателя"
description = "Максимальное время между нажатиями «Красться» в режиме наблюдателя в миллисекундах. Диапазон: от 100 до 3000."

[gui.config.gestures.cooldown-millis]
name = "Задержка смены"
description = "Время ожидания после успешной смены режима в миллисекундах. Диапазон: от 0 до 60000; 0 убирает ожидание."

[gui.config.gestures.require-empty-hands]
name = "Требовать пустые руки"
description = "Требовать, чтобы обе руки были пустыми, прежде чем жест сможет сменить режим."

[gui.config.gestures.spectator-exit]
