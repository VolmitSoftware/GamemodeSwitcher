[gui.config.gestures.normal.adventure]
name = "Из Приключения"
description = "Целевой режим при двойном нажатии клавиши «Заменить предмет во второй руке» в режиме Приключение."

[gui.config.gestures.sneaking.survival]
name = "Из Выживания"
description = "Целевой режим при двойном нажатии клавиши «Заменить предмет во второй руке» крадучись в режиме Выживание."

[gui.config.gestures.sneaking.creative]
name = "Из Творческого"
description = "Целевой режим при двойном нажатии клавиши «Заменить предмет во второй руке» крадучись в режиме Творческий."

[gui.config.gestures.sneaking.adventure]
name = "Из Приключения"
description = "Целевой режим при двойном нажатии клавиши «Заменить предмет во второй руке» крадучись в режиме Приключение."

[gui.config.restrictions.disabled-worlds]
name = "Отключённые миры"
description = "Миры, где жесты, команды и меню не могут менять режим игры. Нажмите, чтобы выбрать их из списка."

[gui.config.feedback.auto-fly-creative]
name = "Полёт при входе в творческий режим"
description = "Начинать полёт после входа в творческий режим, если игроку разрешено летать."

[gui.config.feedback.sound-enabled]
name = "Звук смены"
description = "Воспроизводить звук подтверждения после успешной смены режима игры."

[gui.config.diagnostics.upload-enabled]
name = "Публичная загрузка отчётов"
description = "Разрешить публичную загрузку диагностических отчётов. Используйте upload=false, чтобы сохранить отчёт локально."

[gui.config.feedback.chat-enabled]
name = "Сообщения в чате"
description = "Показывать успешные смены и подсказки режима наблюдателя в чате. Если отключено, причины неудач показываются в строке действий."

[gui.config.feedback.action-bar-enabled]
name = "Уведомление в строке действий"
description = "Показывать новый режим над панелью быстрого доступа, а в режиме наблюдателя — подсказку для выхода."

[gui.config.feedback.title-enabled]
name = "Заголовок на экране"
description = "Показывать новый режим в центре экрана, а в режиме наблюдателя — подсказку для выхода."

[gui.config.feedback.popup-duration-ticks]
name = "Длительность уведомлений"
description = "Длительность заголовка и строки действий в тиках; 20 тиков = 1 секунда. Диапазон: от 1 до 200."

[gui.config.feedback.sound]
name = "Ключ звука"
description = "Звук, воспроизводимый после успешной смены режима игры."
input = "Введите ключ звука с пространством имён, например minecraft:ui.button.click или minecraft:entity.experience_orb.pickup. Разрешены ключи пользовательских наборов ресурсов."

[gui.config.feedback.sound-volume]
name = "Громкость звука"
description = "Громкость звука смены. Диапазон: от 0 до 1; 0 — без звука."

[gui.config.feedback.sound-pitch]
name = "Высота звука"
description = "Высота звука смены. Диапазон: от 0.5 до 2; 1 — исходная высота."

