# GamemodeSwitcher — ru_RU
#
# === Редактирование файла ===
# plugins/GamemodeSwitcher/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /gsw language server edit ru_RU
#
# === Префикс ===
# {prefix}  глобальное значение runtime.prefix. Удалите {prefix} из отдельного сообщения, чтобы скрыть его только там
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage.
# Чтобы показать & или [ буквально, поставьте перед символом обратную косую черту.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {after}  Ценность после изменения
#   {argument}  неожиданный аргумент
#   {before}  Ценность перед изменением
#   {command}  путь команды
#   {count}  Количество совпадающих записей
#   {enabled}  Состояние переключения режимов игры
#   {group}  Категория редактора языка
#   {hot_reload}  состояние перезагрузки
#   {key}  ключ параметра
#   {language}  активный язык
#   {line}  Источник строки или номер строки
#   {locale}  локаль
#   {maximum}  Максимально допустимая стоимость
#   {mode}  Название режима игры
#   {new}  новое значение
#   {number}  Номер записи
#   {old}  предыдущее значение
#   {page}  Номер текущей страницы
#   {pages}  Общее число страниц
#   {parameter}  имя параметра
#   {path}  путь локального отчёта
#   {permission}  необходимое разрешение
#   {personal}  личная локаль
#   {plugin}  Название плагина
#   {prefix}  глобальное значение runtime.prefix. Удалите {prefix} из отдельного сообщения, чтобы скрыть его только там
#   {reason}  причина ошибки
#   {sound}  Идентификатор звука
#   {scheduler}  планировщик
#   {seconds}  Оставшееся время ожидания или подтверждения в секундах
#   {section}  Раздел редактора языков
#   {setting}  название настройки
#   {step}  Изменение числового параметра за один обычный щелчок
#   {state}  Личное состояние жестов или уведомлений
#   {target}  Целевой игрок, сущность или ценность
#   {type}  тип
#   {url}  публичный URL
#   {value}  текущее, стандартное или исходное значение
#   {variables}  допустимые заполнители
#   {version}  версия плагина
#   {world}  мир

