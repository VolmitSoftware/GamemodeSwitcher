[gui.config.gestures.normal]
name = "Целевые режимы двойного нажатия"
description = "Выбрать, в какой режим ведёт двойное нажатие клавиши «Заменить предмет во второй руке» из каждого режима игры."

[gui.config.gestures.sneaking]
name = "Целевые режимы крадучись"
description = "Выбрать, в какой режим ведёт двойное нажатие клавиши «Заменить предмет во второй руке» крадучись из каждого режима игры."

[gui.config.restrictions]
