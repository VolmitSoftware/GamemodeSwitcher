# GamemodeSwitcher — ru_RU
#
# === Редактирование файла ===
# plugins/GamemodeSwitcher/languages/ru_RU.toml
# Этот файл можно редактировать напрямую. Локальные изменения сохраняются; для отсутствующих или неверных записей используется встроенный английский текст.
# /gsw language server edit ru_RU
#
# === Префикс ===
# {prefix}  глобальное значение runtime.prefix. Удалите {prefix} из отдельного сообщения, чтобы скрыть его только там
#
# === Форматирование ===
# Цвета: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B и [RRGGBB]. Для своего оформления также доступен MiniMessage.
# Чтобы показать & или [ буквально, поставьте перед символом обратную косую черту.
#
# === Переменные ===
# Не меняйте имена переменных и используйте только переменные исходного сообщения.
#   {added}  Сообщения, добавленные обновлением языка
#   {after}  Значение после изменения
#   {argument}  Неожиданный аргумент команды
#   {before}  Значение до изменения
#   {command}  Путь команды
#   {count}  Количество совпадающих записей
#   {enabled}  Состояние смены режима игры
#   {folder}  Имя папки мира
#   {group}  Название категории сообщений
#   {hot_reload}  Состояние автоматической перезагрузки файлов
#   {java}  Требуемая версия Java
#   {kept}  Локальные правки, сохранённые при обновлении языка
#   {key}  Ключ параметра или сообщения
#   {language}  Язык сервера
#   {line}  Номер строки сообщения
#   {locale}  Идентификатор локали
#   {maximum}  Максимально допустимое значение
#   {minecraft}  Поддерживаемый диапазон версий Minecraft
#   {mode}  Название режима игры
#   {new}  Новое значение настройки
#   {number}  Номер записи в списке
#   {old}  Предыдущее значение настройки
#   {page}  Номер текущей страницы
#   {pages}  Общее число страниц
#   {parameter}  Имя параметра
#   {path}  Путь к локальному диагностическому отчёту
#   {permission}  Необходимое разрешение
#   {personal}  Личный язык, если он отличается от языка сервера по умолчанию
#   {plugin}  Название плагина
#   {prefix}  Глобальное значение runtime.prefix; в каждом сообщении необязательно
#   {reason}  Причина ошибки
#   {remaining}  Время до следующей разрешённой проверки языков
#   {scheduler}  Реализация планировщика
#   {seconds}  Оставшееся время ожидания или подтверждения в секундах
#   {section}  Раздел редактора языков
#   {setting}  Название настройки
#   {sound}  Идентификатор звука с пространством имён
#   {state}  Состояние жестов или уведомлений игрока
#   {step}  Изменение числовой настройки за один обычный щелчок
#   {target}  Цель выбора языка
#   {type}  Тип параметра
#   {updated}  Сообщения, изменённые обновлением языка
#   {url}  Публичный URL диагностического отчёта
#   {value}  Текущее, стандартное или исходное значение
#   {variables}  Заполнители, допустимые для выбранного сообщения
#   {version}  Версия плагина
#   {world}  Название мира

