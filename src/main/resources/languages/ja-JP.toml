# GamemodeSwitcher — ja-JP
#
# === ファイルの編集 ===
# plugins/GamemodeSwitcher/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /gsw language server edit ja-JP
#
# === 接頭辞 ===
# {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
# & または [ の前にバックスラッシュを付けると、その文字をそのまま表示できます。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {added}  言語更新で追加されたメッセージ
#   {after}  変更後の値
#   {argument}  予期しないコマンド引数
#   {before}  変更前の値
#   {command}  コマンドパス
#   {count}  一致した項目の数
#   {enabled}  ゲームモード切り替えの状態
#   {folder}  ワールドフォルダー名
#   {group}  メッセージカテゴリ名
#   {hot_reload}  ファイル自動再読み込みの状態
#   {java}  必要な Java バージョン
#   {kept}  言語更新で保持されたローカル編集
#   {key}  パラメーターまたはメッセージのキー
#   {language}  サーバー言語
#   {line}  メッセージの行番号
#   {locale}  ロケール識別子
#   {maximum}  受け付ける最大値
#   {minecraft}  対応する Minecraft バージョン範囲
#   {mode}  ゲームモード名
#   {new}  新しい設定値
#   {number}  リスト項目の番号
#   {old}  以前の設定値
#   {page}  現在のページ番号
#   {pages}  総ページ数
#   {parameter}  パラメーター名
#   {path}  ローカル診断レポートのパス
#   {permission}  必要な権限
#   {personal}  サーバーのデフォルトと異なる場合の個人言語
#   {plugin}  プラグイン名
#   {prefix}  グローバルな runtime.prefix の値。メッセージごとに省略可能
#   {reason}  失敗理由
#   {remaining}  次の言語確認が可能になるまでの時間
#   {scheduler}  スケジューラーの実装
#   {seconds}  残りのクールダウンまたは確認時間（秒）
#   {section}  言語エディターのセクション
#   {setting}  設定名
#   {sound}  名前空間付きのサウンド識別子
#   {state}  プレイヤーのジェスチャーまたは通知の設定
#   {step}  通常のクリック1回で変わる数値設定の変化量
#   {target}  言語選択の対象
#   {type}  パラメーターの型
#   {updated}  言語更新で変更されたメッセージ
#   {url}  公開診断レポートの URL
#   {value}  現在値、デフォルト値、または生の値
#   {variables}  選択したメッセージで使えるプレースホルダー
#   {version}  プラグインのバージョン
#   {world}  ワールド名

