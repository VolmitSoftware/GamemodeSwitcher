# GamemodeSwitcher — ja-JP
#
# === ファイルの編集 ===
# plugins/GamemodeSwitcher/languages/ja-JP.toml
# このファイルを直接編集できます。ローカルの変更は保持され、不足または無効な項目には内蔵の英語を使用します。
# /gsw language server edit ja-JP
#
# === 接頭辞 ===
# {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります
#
# === 書式 ===
# 色: &0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B、[RRGGBB]。独自書式には MiniMessage も使用できます。
# & または [ の前にバックスラッシュを付けると、その文字をそのまま表示できます。
#
# === 変数 ===
# 変数名を変更せず、各メッセージに元からある変数だけを使用してください。
#   {after}  変更後の値
#   {argument}  予期しない引数
#   {before}  変更前の値
#   {command}  コマンド経路
#   {count}  マッチングエントリー件数
#   {enabled}  ゲームモード切り替えの有効状態
#   {group}  言語エディターのカテゴリ
#   {hot_reload}  ホットリロード状態
#   {key}  パラメーターキー
#   {language}  使用中の言語
#   {line}  ラインまたはライン番号
#   {locale}  ロケール
#   {maximum}  最大許容値
#   {mode}  ゲームモード名
#   {new}  変更後の値
#   {number}  項目番号
#   {old}  変更前の値
#   {page}  現在のページ番号
#   {pages}  ページの総数
#   {parameter}  パラメーター名
#   {path}  ローカル報告書のパス
#   {permission}  必要な権限
#   {personal}  個人設定のロケール
#   {plugin}  プラグイン名
#   {prefix}  グローバルな runtime.prefix の値です。個別のメッセージから {prefix} を削除すると、その場所だけ非表示になります
#   {reason}  失敗理由
#   {scheduler}  スケジューラー
#   {seconds}  残りのクールダウンまたは確認時間（秒）
#   {section}  言語エディターのセクション
#   {setting}  設定名
#   {step}  通常のクリック1回で変更する数値
#   {sound}  サウンドの識別子
#   {state}  個人のジェスチャーまたは通知の状態
#   {target}  ターゲットプレーヤー、エンティティティティ、または値
#   {type}  型
#   {url}  公開 URL
#   {value}  現在値、既定値、または入力値
#   {variables}  使用可能なプレースホルダー
#   {version}  プラグインのバージョン
#   {world}  ワールド

