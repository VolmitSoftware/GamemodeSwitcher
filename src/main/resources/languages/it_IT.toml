description = "Inizia a volare dopo essere entrato in Creativa, se il giocatore può volare."

[gui.config.feedback.sound-enabled]
name = "Suono del cambio"
description = "Riproduci un suono di conferma dopo un cambio di modalità riuscito."

[gui.config.diagnostics.upload-enabled]
name = "Caricamenti pubblici dei rapporti"
description = "Consenti il caricamento pubblico dei rapporti diagnostici. Usa upload=false per salvare un rapporto localmente."

[gui.config.feedback.chat-enabled]
name = "Messaggi in chat"
description = "Mostra in chat i cambi riusciti e i suggerimenti di Spettatore. Se disattivato, i motivi degli errori appaiono nella barra delle azioni."

[gui.config.feedback.action-bar-enabled]
name = "Avviso nella barra delle azioni"
description = "Mostra la nuova modalità sopra la barra rapida, con un suggerimento per uscire in Spettatore."

[gui.config.feedback.title-enabled]
name = "Titolo a comparsa"
description = "Mostra la nuova modalità al centro dello schermo, con un suggerimento per uscire in Spettatore."

[gui.config.feedback.popup-duration-ticks]
name = "Durata degli avvisi"
description = "Durata del titolo e della barra delle azioni in tick; 20 tick = 1 secondo. Intervallo: da 1 a 200."

[gui.config.feedback.sound]
name = "Chiave del suono"
description = "Suono riprodotto dopo un cambio di modalità riuscito."
input = "Inserisci una chiave del suono con spazio dei nomi, come minecraft:ui.button.click o minecraft:entity.experience_orb.pickup. Sono ammesse chiavi di pacchetti di risorse personalizzati."

[gui.config.feedback.sound-volume]
name = "Volume del suono"
description = "Volume del suono di cambio. Intervallo: da 0 a 1; 0 è silenzioso."

[gui.config.feedback.sound-pitch]
name = "Tonalità del suono"
description = "Tonalità del suono di cambio. Intervallo: da 0.5 a 2; 1 usa la tonalità originale."

[sound.menu]
title = "<gradient:#634514:#2f523f>Suono del cambio</gradient>"
current = "<gray>Suono attuale: <white>{sound}</white></gray>"
select = "<gray>Clic sinistro per usarlo. Clic destro per l’anteprima.</gray>"
selected = "<green>Suono selezionato</green>"
preview = "<gold>Anteprima del suono attuale</gold>"
preview-help = "<gray>Ascolta questo suono con il volume e la tonalità attuali del server. L’anteprima funziona anche quando i suoni del cambio sono silenziati.</gray>"
custom = "<gold>Chiave del suono personalizzata</gold>"
custom-help = "<gray>Inserisci una chiave del suono di Minecraft o di un pacchetto di risorse.</gray>"

[sound.preset]
click = "<gold>Clic del pulsante</gold>"
chime = "<gold>Rintocco</gold>"
pling = "<gold>Pling</gold>"
experience = "<gold>Raccolta di esperienza</gold>"
bell = "<gold>Campana</gold>"

[world.menu]
title = "<gradient:#634514:#2f523f>Mondi disabilitati</gradient>"
help = "<gold>Mondi disabilitati</gold>"
help-detail = "<gray>Clicca su un mondo per disattivare o riattivare lì il cambio di modalità di gioco. I mondi vengono salvati con la chiave di dimensione, ad esempio minecraft:the_nether.</gray>"
folder = "<gray>Cartella del mondo: <white>{folder}</white></gray>"
unloaded = "<gray>Non caricato su questo server</gray>"
disabled = "<red>Cambio disattivato</red>"
enabled = "<green>Cambio attivo</green>"
disable = "<gray>Clicca per disattivare il cambio qui.</gray>"
enable = "<gray>Clicca per riattivare il cambio qui.</gray>"
remove = "<gray>Clicca per rimuoverlo dall’elenco.</gray>"

[spectator]
busy = "{prefix}&eÈ già in corso una transizione Spettatore.&r"
none = "{prefix}&eNon hai una sessione Spettatore attiva.&r"
return-failed = "{prefix}&cImpossibile tornare. La sessione è salvata; riprova /gsw return.&r"
origin-missing = "{prefix}&eIl mondo da cui sei entrato in Spettatore non è più caricato, quindi la modalità di gioco è stata cambiata dove ti trovi.&r"
save-failed = "{prefix}&cImpossibile salvare la sessione Spettatore. La modalità di gioco non è stata cambiata.&r"

[gui.config.spectator]
name = "Ritorno da Spettatore"
description = "Ripristina la modalità o la posizione registrate quando questo plugin avvia una sessione Spettatore."

[gui.config.spectator.restore-previous-mode]
name = "Ripristina modalità precedente"
description = "Premi Accovacciati tre volte o usa /gsw return per ripristinare la modalità da cui sei entrato in Spettatore. I permessi e le restrizioni dei mondi attuali restano validi."

[gui.config.spectator.return-to-origin]
name = "Torna alla posizione di partenza"
description = "Torna alla posizione di ingresso salvata prima di uscire da una sessione Spettatore avviata dal plugin."

[gui.config.spectator.allow-unsafe-return]
name = "Consenti ritorni non sicuri"
description = "Consenti ritorni senza controllare il pavimento o lo spazio libero. Attivo per impostazione predefinita; disattivalo per richiedere una destinazione sicura. Vale anche per le sessioni attive."

[gui.config.general.update-notifications]
name = "Notifiche degli aggiornamenti"
description = "Controlla le versioni su GitHub e avvisa i giocatori autorizzati tramite la notifica condivisa di Volmit. Nessun aggiornamento viene installato."
