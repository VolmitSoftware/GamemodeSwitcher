# GamemodeSwitcher — it_IT
#
# === Modifica del file ===
# plugins/GamemodeSwitcher/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /gsw language server edit it_IT
#
# === Prefisso ===
# {prefix}  il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
# Anteponi una barra inversa per mostrare & o [ letteralmente.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {added}  Messaggi aggiunti da un aggiornamento della lingua
#   {after}  Valore dopo la modifica
#   {argument}  Argomento del comando inatteso
#   {before}  Valore prima della modifica
#   {command}  Percorso del comando
#   {count}  Numero di voci corrispondenti
#   {enabled}  Stato del cambio di modalità di gioco
#   {folder}  Nome della cartella del mondo
#   {group}  Nome della categoria di messaggi
#   {hot_reload}  Stato del ricaricamento automatico dei file
#   {java}  Versione di Java richiesta
#   {kept}  Modifiche locali conservate da un aggiornamento della lingua
#   {key}  Chiave del parametro o del messaggio
#   {language}  Lingua del server
#   {line}  Numero di riga del messaggio
#   {locale}  Identificatore della lingua
#   {maximum}  Valore massimo accettato
#   {minecraft}  Intervallo di versioni di Minecraft supportate
#   {mode}  Nome della modalità di gioco
#   {new}  Nuovo valore dell’impostazione
#   {number}  Numero della voce dell’elenco
#   {old}  Valore precedente dell’impostazione
#   {page}  Numero della pagina attuale
#   {pages}  Numero totale di pagine
#   {parameter}  Nome del parametro
#   {path}  Percorso locale del rapporto diagnostico
#   {permission}  Permesso richiesto
#   {personal}  Lingua personale, se diversa da quella predefinita del server
#   {plugin}  Nome del plugin
#   {prefix}  Valore globale di runtime.prefix; facoltativo in ogni messaggio
#   {reason}  Motivo dell’errore
#   {remaining}  Tempo prima che sia consentito il prossimo controllo delle lingue
#   {scheduler}  Implementazione dello scheduler
#   {seconds}  Tempo di attesa o di conferma rimanente in secondi
#   {section}  Sezione dell’editor delle lingue
#   {setting}  Nome dell’impostazione
#   {sound}  Identificatore del suono con spazio dei nomi
#   {state}  Impostazione dei gesti o delle notifiche del giocatore
#   {step}  Variazione numerica di un clic normale
#   {target}  Destinazione della scelta della lingua
#   {type}  Tipo del parametro
#   {updated}  Messaggi modificati da un aggiornamento della lingua
#   {url}  URL pubblico del rapporto diagnostico
#   {value}  Valore attuale, predefinito o grezzo
#   {variables}  Segnaposto validi per il messaggio selezionato
#   {version}  Versione del plugin
#   {world}  Nome del mondo

