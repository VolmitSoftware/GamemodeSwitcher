# GamemodeSwitcher — it_IT
#
# === Modifica del file ===
# plugins/GamemodeSwitcher/languages/it_IT.toml
# Puoi modificare direttamente questo file. Le modifiche locali vengono conservate; le voci mancanti o non valide usano l’inglese incorporato.
# /gsw language server edit it_IT
#
# === Prefisso ===
# {prefix}  il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì
#
# === Formattazione ===
# Colori: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B e [RRGGBB]. MiniMessage resta disponibile per formati personalizzati.
# Anteponi una barra inversa per mostrare & o [ letteralmente.
#
# === Variabili ===
# Mantieni i nomi delle variabili e usa solo quelle previste dal singolo messaggio.
#   {after}  Valore dopo il cambiamento
#   {argument}  argomento inatteso
#   {before}  Valore prima della modifica
#   {command}  percorso del comando
#   {count}  Numero di voci corrispondenti
#   {enabled}  Stato del cambio di modalità
#   {group}  Categoria dell’editor di lingua
#   {hot_reload}  stato ricaricamento
#   {key}  chiave parametro
#   {language}  lingua attiva
#   {line}  Linea di origine o numero di linea
#   {locale}  codice locale
#   {maximum}  Valore massimo consentito
#   {mode}  Nome della modalità di gioco
#   {new}  valore nuovo
#   {number}  Numero della voce
#   {old}  valore precedente
#   {page}  Pagina attuale
#   {pages}  Numero totale di pagine
#   {parameter}  nome parametro
#   {path}  percorso rapporto locale
#   {permission}  permesso richiesto
#   {personal}  codice locale personale
#   {plugin}  Nome del plugin
#   {prefix}  il valore globale runtime.prefix. Rimuovi {prefix} da un singolo messaggio per nasconderlo solo lì
#   {reason}  motivo errore
#   {scheduler}  scheduler
#   {seconds}  Tempo di attesa o conferma rimanente in secondi
#   {section}  Sezione dell’editor delle lingue
#   {setting}  nome impostazione
#   {step}  Variazione di un valore numerico con un clic normale
#   {state}  Stato personale dei gesti o delle notifiche
#   {target}  Giocatore di destinazione, entità o valore
#   {type}  tipo
#   {url}  URL pubblico
#   {value}  valore corrente, predefinito o grezzo
#   {variables}  segnaposto validi
#   {version}  versione del plugin
#   {world}  mondo

