description = "进入创造模式后，如果玩家可以飞行，则开始飞行。"

[gui.config.feedback.sound-enabled]
name = "切换声音"
description = "游戏模式切换成功后播放确认音。"

[gui.config.diagnostics.upload-enabled]
name = "公开诊断报告"
description = "允许公开上传诊断报告。使用 upload=false 将报告保存到本地。"

[gui.config.feedback.chat-enabled]
name = "聊天消息"
description = "在聊天中显示切换成功消息和旁观者提示。关闭后，失败原因显示在动作栏中。"

[gui.config.feedback.action-bar-enabled]
name = "动作栏提示"
description = "在快捷栏上方显示新模式，旁观者模式下附带退出提示。"

[gui.config.feedback.title-enabled]
name = "标题提示"
description = "在屏幕中央显示新模式，旁观者模式下附带退出提示。"

[gui.config.feedback.popup-duration-ticks]
name = "提示时长"
description = "标题和动作栏的显示时长，以刻为单位；20 刻等于 1 秒。范围：1 至 200。"

[gui.config.feedback.sound]
name = "声音标识"
description = "游戏模式切换成功后播放的声音。"
input = "输入带命名空间的声音标识，例如 minecraft:ui.button.click 或 minecraft:entity.experience_orb.pickup。允许使用自定义资源包的标识。"

[gui.config.feedback.sound-volume]
name = "音量"
description = "切换声音的音量。范围：0 至 1；0 为静音。"

[gui.config.feedback.sound-pitch]
name = "音调"
description = "切换声音的音调。范围：0.5 至 2；1 使用原始音调。"
