# GamemodeSwitcher — zh_CN
#
# === 编辑文件 ===
# plugins/GamemodeSwitcher/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /gsw language server edit zh_CN
#
# === 前缀 ===
# {prefix}  全局 runtime.prefix 值。从某条消息中删除 {prefix}，即可只在该消息中隐藏前缀
#
# === 格式 ===
# 颜色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自定义格式仍可使用 MiniMessage。
# 在 & 或 [ 前添加反斜杠可按原样显示该字符。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {after}  更改后的数值
#   {argument}  意外参数
#   {before}  变化前的价值
#   {command}  命令路径
#   {count}  匹配条目数
#   {enabled}  游戏模式切换的启用状态
#   {group}  语言编辑器分类
#   {hot_reload}  热重载状态
#   {key}  参数键
#   {language}  当前语言
#   {line}  源行或行号
#   {locale}  区域设置
#   {maximum}  允许的最大值
#   {mode}  游戏模式名称
#   {new}  新值
#   {number}  条目编号
#   {old}  旧值
#   {page}  当前页码
#   {pages}  总页数
#   {parameter}  参数名称
#   {path}  本地报告路径
#   {permission}  所需权限
#   {personal}  个人区域设置
#   {plugin}  插件名称
#   {prefix}  全局 runtime.prefix 值。从某条消息中删除 {prefix}，即可只在该消息中隐藏前缀
#   {reason}  失败原因
#   {scheduler}  调度器
#   {seconds}  剩余冷却或确认时间（秒）
#   {section}  语言编辑器分区
#   {setting}  设置名称
#   {step}  一次普通点击所改变的数值
#   {state}  个人手势或通知状态
#   {target}  目标玩家、实体或值
#   {type}  类型
#   {url}  公开报告网址
#   {value}  当前值、默认值或原始值
#   {variables}  可用占位符
#   {version}  插件版本
#   {world}  世界

