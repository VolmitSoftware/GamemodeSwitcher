subtitle = "&7Đã đổi chế độ chơi.&r"
overlay = "&7Chế độ chơi: &f{mode}&r"
spectator_overlay_hint = "&7Nhấn cúi ba lần để thoát Quan sát.&r"
already = "{prefix}&eBạn đã ở chế độ {mode}.&r"
cancelled = "{prefix}&eMột plugin khác đã chặn việc đổi chế độ chơi.&r"
changed = "{prefix}&aĐã đổi chế độ chơi sang {mode}.&r"
cooldown = "{prefix}&eChờ {seconds} giây trước khi đổi tiếp.&r"
disabled = "{prefix}&eChức năng đổi chế độ chơi đã bị tắt.&r"
empty_hands = "{prefix}&eĐể trống cả hai tay để dùng thao tác đổi chế độ.&r"
no_permission = "{prefix}&eBạn không có quyền dùng chế độ chơi này.&r"
spectator_hint = "{prefix}&eDùng /gsw menu hoặc /gsw set survival để rời chế độ khán giả.&r"
world_blocked = "{prefix}&eKhông thể đổi chế độ chơi trong {world}.&r"

[toggle]
disabled = "{prefix}&eĐã tắt thao tác. Lệnh và trình đơn vẫn dùng được.&r"
enabled = "{prefix}&aĐã bật thao tác đổi chế độ chơi.&r"

[gui.config.general]
name = "Chung"
description = "Bật đổi chế độ chơi và chọn ngôn ngữ máy chủ."

[gui.config.metrics]
name = "Thống kê"
description = "Quản lý thống kê ẩn danh của bStats."

[gui.config.gestures]
name = "Điều khiển cử chỉ"
description = "Đặt khoảng nhấn, thời gian chờ và đích của cử chỉ."

[gui.config.gestures.normal]
name = "Đích nhấn hai lần"
description = "Chọn đích cho từng chế độ khi nhấn phím đổi tay hai lần."

[gui.config.gestures.sneaking]
name = "Đích khi cúi"
description = "Chọn đích cho từng chế độ khi cúi và nhấn phím đổi tay hai lần."

[gui.config.restrictions]
name = "Giới hạn thế giới"
description = "Chọn thế giới không cho phép đổi chế độ chơi."

[gui.config.feedback]
name = "Thông báo đổi chế độ"
description = "Chọn tin nhắn, thông báo, âm thanh và cách bay Sáng tạo khi đổi."

[gui.config.diagnostics]
name = "Chẩn đoán"
description = "Quản lý việc tải báo cáo chẩn đoán lên công khai."

[gui.config.languages]
name = "Ngôn ngữ"
description = "Sửa bản dịch máy chủ và định dạng của chúng."

[gui.config.general.enabled]
name = "Đổi chế độ chơi"
description = "Cho phép đổi bằng cử chỉ, lệnh và menu."

[gui.config.general.language]
name = "Ngôn ngữ máy chủ"
description = "Ngôn ngữ mặc định cho người chưa chọn ngôn ngữ riêng. Mục thiếu bản dịch dùng tiếng Anh."

[gui.config.metrics.enabled]
name = "Thống kê ẩn danh"
description = "Gửi thống kê ẩn danh tới bStats. Cài đặt tắt bStats toàn cục cũng có hiệu lực."

[gui.config.gestures.double-tap-millis]
name = "Khoảng nhấn hai lần"
description = "Thời gian tối đa giữa các lần nhấn đổi tay, tính bằng mili giây. Phạm vi: 100 đến 3000."

[gui.config.gestures.sneak-tap-millis]
name = "Khoảng nhấn Quan sát"
description = "Thời gian tối đa giữa các lần nhấn cúi trong Quan sát, tính bằng mili giây. Phạm vi: 100 đến 3000."

[gui.config.gestures.cooldown-millis]
name = "Thời gian chờ đổi"
description = "Thời gian chờ sau khi đổi thành công, tính bằng mili giây. Phạm vi: 0 đến 60000; 0 bỏ thời gian chờ."

[gui.config.gestures.require-empty-hands]
name = "Yêu cầu tay trống"
description = "Yêu cầu cả hai tay trống để cử chỉ có thể đổi chế độ."

[gui.config.gestures.spectator-exit]
name = "Thoát chế độ Quan sát"
description = "Đích sau ba lần nhấn cúi riêng biệt trong Quan sát."

[gui.config.gestures.normal.survival]
name = "Từ Sinh tồn"
description = "Đích khi nhấn phím đổi tay hai lần trong chế độ Sinh tồn."

[gui.config.gestures.normal.creative]
name = "Từ Sáng tạo"
description = "Đích khi nhấn phím đổi tay hai lần trong chế độ Sáng tạo."

[gui.config.gestures.normal.adventure]
name = "Từ Phiêu lưu"
description = "Đích khi nhấn phím đổi tay hai lần trong chế độ Phiêu lưu."

[gui.config.gestures.sneaking.survival]
name = "Từ Sinh tồn"
description = "Đích khi cúi và nhấn phím đổi tay hai lần trong chế độ Sinh tồn."

[gui.config.gestures.sneaking.creative]
name = "Từ Sáng tạo"
description = "Đích khi cúi và nhấn phím đổi tay hai lần trong chế độ Sáng tạo."

[gui.config.gestures.sneaking.adventure]
name = "Từ Phiêu lưu"
description = "Đích khi cúi và nhấn phím đổi tay hai lần trong chế độ Phiêu lưu."

[gui.config.restrictions.disabled-worlds]
name = "Thế giới bị vô hiệu hóa"
description = "Tên thế giới nơi cử chỉ, lệnh và menu không thể đổi chế độ. Không phân biệt chữ hoa và chữ thường."
input = "Nhập danh sách tên thế giới, chẳng hạn [\"world_nether\", \"world_the_end\"]. Dùng [] để không giới hạn thế giới."

[gui.config.feedback.auto-fly-creative]
name = "Bay khi vào Sáng tạo"
description = "Bắt đầu bay sau khi vào Sáng tạo nếu người chơi được phép bay."

[gui.config.feedback.sound-enabled]
name = "Âm thanh đổi chế độ"
description = "Phát âm thanh xác nhận sau khi đổi chế độ thành công."

[gui.config.diagnostics.upload-enabled]
name = "Báo cáo công khai"
description = "Cho phép tải báo cáo chẩn đoán lên công khai. Dùng upload=false để lưu báo cáo cục bộ."

[gui.config.feedback.chat-enabled]
name = "Tin nhắn trò chuyện"
description = "Hiện lần đổi thành công và gợi ý Quan sát trong trò chuyện. Khi tắt, lý do thất bại hiện trên thanh hành động."

[gui.config.feedback.action-bar-enabled]
name = "Thông báo thanh hành động"
description = "Hiện chế độ mới trên thanh vật phẩm, kèm gợi ý thoát khi ở Quan sát."

[gui.config.feedback.title-enabled]
name = "Thông báo tiêu đề"
description = "Hiện chế độ mới giữa màn hình, kèm gợi ý thoát khi ở Quan sát."

[gui.config.feedback.popup-duration-ticks]
name = "Thời lượng thông báo"
description = "Thời lượng tiêu đề và thanh hành động tính bằng tick; 20 tick = 1 giây. Phạm vi: 1 đến 200."

[gui.config.feedback.sound]
name = "Khóa âm thanh"
description = "Âm thanh phát sau khi đổi chế độ thành công."
input = "Nhập khóa âm thanh có không gian tên, như minecraft:ui.button.click hoặc minecraft:entity.experience_orb.pickup. Có thể dùng khóa của gói tài nguyên tùy chỉnh."

[gui.config.feedback.sound-volume]
name = "Âm lượng"
description = "Âm lượng của tiếng đổi chế độ. Phạm vi: 0 đến 1; 0 là im lặng."

[gui.config.feedback.sound-pitch]
name = "Cao độ"
description = "Cao độ của tiếng đổi chế độ. Phạm vi: 0.5 đến 2; 1 dùng cao độ gốc."

[spectator]
save-failed = "{prefix}&cKhông thể lưu phiên. Chế độ chơi chưa thay đổi.&r"
return-failed = "{prefix}&cKhông thể trở về. Phiên đã được lưu; hãy thử lại /gsw return.&r"
none = "{prefix}&cBạn không có phiên khán giả đang hoạt động.&r"
busy = "{prefix}&cĐang chuyển chế độ khán giả.&r"

[gui.config.spectator]
description = "Chọn khôi phục chế độ trước và trở về vị trí ban đầu."
name = "Phiên khán giả"

[gui.config.spectator.restore-previous-mode]
description = "Trở về chế độ trước khi kết thúc phiên khán giả."
name = "Khôi phục chế độ trước"

[gui.config.spectator.return-to-origin]
description = "Trở về vị trí ban đầu đã lưu trước khi thoát phiên khán giả do plugin bắt đầu."
name = "Trở về vị trí ban đầu"

[sound.menu]
