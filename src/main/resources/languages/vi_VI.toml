preview = "<gray>Nghe thử âm thanh hiện tại</gray>"
selected = "<gray>Âm thanh đã chọn</gray>"
select = "<gray>Nhấp trái để chọn. Nhấp phải để nghe thử.</gray>"
current = "<gray>Âm thanh hiện tại: {sound}</gray>"
title = "<gradient:#634514:#2f523f>Âm thanh chuyển chế độ</gradient>"

[sound.preset]
bell = "<gray>Chuông</gray>"
