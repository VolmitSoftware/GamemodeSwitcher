click = "<gray>Tiếng nhấn nút</gray>"

[gui.config.spectator.allow-unsafe-return]
name = "Cho phép trở về không an toàn"
description = "Trở về mà không kiểm tra nền và khoảng trống. Mặc định bật; tắt để yêu cầu nơi đến an toàn. Áp dụng cả phiên đang hoạt động."
