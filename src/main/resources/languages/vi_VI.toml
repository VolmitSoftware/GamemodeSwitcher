# GamemodeSwitcher — vi_VI
#
# === Chỉnh sửa tệp ===
# plugins/GamemodeSwitcher/languages/vi_VI.toml
# Bạn có thể chỉnh sửa trực tiếp tệp này. Thay đổi cục bộ được giữ lại; mục thiếu hoặc không hợp lệ dùng bản tiếng Anh tích hợp.
# /gsw language server edit vi_VI
#
# === Tiền tố ===
# {prefix}  giá trị runtime.prefix toàn cục. Xóa {prefix} khỏi từng thông báo nếu không muốn hiện ở thông báo đó
#
# === Định dạng ===
# Màu: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B và [RRGGBB]. MiniMessage vẫn dùng được cho định dạng tùy chỉnh.
# Thêm dấu gạch chéo ngược trước & hoặc [ để hiển thị ký tự theo nghĩa đen.
#
# === Biến ===
# Giữ nguyên tên biến và chỉ dùng những biến có sẵn trong từng thông báo.
#   {added}  Thông báo được thêm bởi bản cập nhật ngôn ngữ
#   {after}  Giá trị sau khi thay đổi
#   {argument}  Đối số lệnh ngoài dự kiến
#   {before}  Giá trị trước khi thay đổi
#   {command}  Đường dẫn lệnh
#   {count}  Số mục khớp
#   {enabled}  Trạng thái đổi chế độ chơi
#   {folder}  Tên thư mục thế giới
#   {group}  Tên danh mục thông báo
#   {hot_reload}  Trạng thái tự động tải lại tệp
#   {java}  Phiên bản Java yêu cầu
#   {kept}  Chỉnh sửa cục bộ được giữ lại sau bản cập nhật ngôn ngữ
#   {key}  Khóa tham số hoặc thông báo
#   {language}  Ngôn ngữ máy chủ
#   {line}  Số dòng của thông báo
#   {locale}  Mã ngôn ngữ
#   {maximum}  Giá trị tối đa được chấp nhận
#   {minecraft}  Phạm vi phiên bản Minecraft được hỗ trợ
#   {mode}  Tên chế độ chơi
#   {new}  Giá trị cài đặt mới
#   {number}  Số thứ tự mục trong danh sách
#   {old}  Giá trị cài đặt trước đó
#   {page}  Số trang hiện tại
#   {pages}  Tổng số trang
#   {parameter}  Tên tham số
#   {path}  Đường dẫn báo cáo chẩn đoán cục bộ
#   {permission}  Quyền cần có
#   {personal}  Ngôn ngữ cá nhân khi khác với mặc định của máy chủ
#   {plugin}  Tên plugin
#   {prefix}  Giá trị runtime.prefix toàn cục; tùy chọn cho từng thông báo
#   {reason}  Lý do lỗi
#   {remaining}  Thời gian còn lại đến khi được kiểm tra ngôn ngữ tiếp
#   {scheduler}  Bộ lập lịch đang dùng
#   {seconds}  Thời gian chờ hoặc xác nhận còn lại tính bằng giây
#   {section}  Mục trong trình chỉnh sửa ngôn ngữ
#   {setting}  Tên cài đặt
#   {sound}  Mã âm thanh có không gian tên
#   {state}  Cài đặt cử chỉ hoặc thông báo của người chơi
#   {step}  Mức thay đổi cài đặt số sau một lần nhấp thông thường
#   {target}  Đối tượng của lựa chọn ngôn ngữ
#   {type}  Kiểu tham số
#   {updated}  Thông báo được thay đổi bởi bản cập nhật ngôn ngữ
#   {url}  URL công khai của báo cáo chẩn đoán
#   {value}  Giá trị hiện tại, mặc định hoặc thô
#   {variables}  Biến hợp lệ cho thông báo đã chọn
#   {version}  Phiên bản plugin
#   {world}  Tên thế giới

