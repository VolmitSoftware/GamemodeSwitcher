[gui.config.feedback.chat-enabled]
name = "Mensajes de chat"
description = "Mostrar los cambios correctos y las indicaciones de Espectador en el chat. Si se desactiva, los motivos de fallo aparecen en la barra de acción."

[gui.config.feedback.action-bar-enabled]
name = "Aviso en la barra de acción"
description = "Mostrar el nuevo modo encima de la barra de objetos, con una indicación para salir en Espectador."

[gui.config.feedback.title-enabled]
name = "Aviso de título"
description = "Mostrar el nuevo modo en el centro de la pantalla, con una indicación para salir en Espectador."

[gui.config.feedback.popup-duration-ticks]
name = "Duración de los avisos"
description = "Duración del título y de la barra de acción en tics; 20 tics = 1 segundo. Rango: 1 a 200."

[gui.config.feedback.sound]
name = "Clave de sonido"
description = "Sonido que se reproduce tras un cambio de modo de juego correcto."
input = "Introduce una clave de sonido con espacio de nombres, como minecraft:ui.button.click o minecraft:entity.experience_orb.pickup. Se permiten claves personalizadas de paquetes de recursos."

[gui.config.feedback.sound-volume]
name = "Volumen"
description = "Volumen del sonido de cambio. Rango: 0 a 1; 0 es silencio."

[gui.config.feedback.sound-pitch]
name = "Tono"
description = "Tono del sonido de cambio. Rango: 0.5 a 2; 1 usa el tono original."

[sound.menu]
title = "<gradient:#634514:#2f523f>Sonido de cambio</gradient>"
current = "<gray>Sonido actual: <white>{sound}</white></gray>"
select = "<gray>Clic izquierdo para usarlo. Clic derecho para escucharlo.</gray>"
selected = "<green>Sonido seleccionado</green>"
preview = "<gold>Escuchar sonido actual</gold>"
preview-help = "<gray>Escucha este sonido con el volumen y el tono actuales del servidor. La vista previa funciona aunque los sonidos de cambio estén silenciados.</gray>"
custom = "<gold>Clave de sonido personalizada</gold>"
custom-help = "<gray>Introduce una clave de sonido de Minecraft o de un paquete de recursos.</gray>"

[sound.preset]
click = "<gold>Clic de botón</gold>"
chime = "<gold>Campanilla</gold>"
pling = "<gold>Pling</gold>"
experience = "<gold>Recoger experiencia</gold>"
bell = "<gold>Campana</gold>"

[world.menu]
title = "<gradient:#634514:#2f523f>Mundos desactivados</gradient>"
help = "<gold>Mundos desactivados</gold>"
help-detail = "<gray>Haz clic en un mundo para desactivar o activar ahí el cambio de modo de juego. Los mundos se guardan por su clave de dimensión, como minecraft:the_nether.</gray>"
folder = "<gray>Carpeta del mundo: <white>{folder}</white></gray>"
unloaded = "<gray>No está cargado en este servidor</gray>"
disabled = "<red>Cambio desactivado</red>"
enabled = "<green>Cambio activado</green>"
disable = "<gray>Haz clic para desactivar el cambio aquí.</gray>"
enable = "<gray>Haz clic para volver a activar el cambio aquí.</gray>"
remove = "<gray>Haz clic para quitarlo de la lista.</gray>"

[spectator]
busy = "{prefix}&eYa hay una transición de espectador en curso.&r"
none = "{prefix}&eNo tienes una sesión de espectador activa.&r"
return-failed = "{prefix}&cNo se pudo regresar. Tu sesión está guardada; vuelve a intentarlo con /gsw return.&r"
origin-missing = "{prefix}&eTu mundo de entrada en Espectador ya no está cargado, así que tu modo de juego cambió donde estás.&r"
save-failed = "{prefix}&cNo se pudo guardar tu sesión de espectador. Tu modo de juego no ha cambiado.&r"

[gui.config.spectator]
name = "Regreso de Espectador"
description = "Restaurar el modo o la ubicación guardados cuando este plugin inicia una sesión de espectador."

[gui.config.spectator.restore-previous-mode]
name = "Restaurar modo anterior"
description = "Pulsa Agacharse tres veces o usa /gsw return para restaurar el modo desde el que entraste en Espectador. Se siguen aplicando los permisos y las restricciones de mundo actuales."

[gui.config.spectator.return-to-origin]
name = "Volver al punto de partida"
description = "Regresar a la ubicación de entrada guardada antes de salir de una sesión de espectador iniciada por el plugin."

[gui.config.spectator.allow-unsafe-return]
name = "Permitir regresos inseguros"
description = "Permitir regresos sin comprobar el suelo ni el espacio libre. Activado por defecto; desactívalo para exigir un destino seguro. También se aplica a las sesiones activas."

[gui.config.general.update-notifications]
name = "Avisos de actualizaciones"
description = "Comprobar las versiones publicadas en GitHub y avisar a los jugadores con permiso mediante el aviso compartido de Volmit. No se instala ninguna actualización."
