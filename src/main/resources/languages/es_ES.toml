# GamemodeSwitcher — es_ES
#
# === Editar el archivo ===
# plugins/GamemodeSwitcher/languages/es_ES.toml
# Puedes editar este archivo directamente. Los cambios locales se conservan; las entradas ausentes o no válidas usan el inglés incorporado.
# /gsw language server edit es_ES
#
# === Prefijo ===
# {prefix}  el valor global runtime.prefix. Elimina {prefix} de un mensaje para ocultarlo solo allí
#
# === Formato ===
# Colores: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B y [RRGGBB]. MiniMessage sigue disponible para formatos personalizados.
# Antepón una barra inversa para mostrar & o [ literalmente.
#
# === Variables ===
# Mantén los nombres de las variables y usa solo las que pertenecen a cada mensaje.
#   {added}  Mensajes añadidos por una actualización de idioma
#   {after}  Valor después del cambio
#   {argument}  Argumento de comando inesperado
#   {before}  Valor antes del cambio
#   {command}  Ruta del comando
#   {count}  Número de entradas coincidentes
#   {enabled}  Estado del cambio de modo de juego
#   {folder}  Nombre de la carpeta del mundo
#   {group}  Nombre de la categoría de mensajes
#   {hot_reload}  Estado de la recarga automática de archivos
#   {java}  Versión de Java necesaria
#   {kept}  Ediciones locales conservadas por una actualización de idioma
#   {key}  Clave de parámetro o de mensaje
#   {language}  Idioma del servidor
#   {line}  Número de línea del mensaje
#   {locale}  Identificador de idioma
#   {maximum}  Valor máximo permitido
#   {minecraft}  Rango de versiones de Minecraft compatibles
#   {mode}  Nombre del modo de juego
#   {new}  Nuevo valor del ajuste
#   {number}  Número de la entrada
#   {old}  Valor anterior del ajuste
#   {page}  Página actual
#   {pages}  Número total de páginas
#   {parameter}  Nombre del parámetro
#   {path}  Ruta local del informe de diagnóstico
#   {permission}  Permiso necesario
#   {personal}  Idioma personal cuando difiere del predeterminado del servidor
#   {plugin}  Nombre del plugin
#   {prefix}  Valor global de runtime.prefix; opcional en cada mensaje
#   {reason}  Motivo del fallo
#   {remaining}  Tiempo restante hasta la próxima comprobación de idiomas
#   {scheduler}  Implementación del planificador
#   {seconds}  Tiempo restante de espera o confirmación en segundos
#   {section}  Sección del editor de idiomas
#   {setting}  Nombre del ajuste
#   {sound}  Identificador de sonido con espacio de nombres
#   {state}  Estado personal de gestos o avisos
#   {step}  Cambio de un ajuste numérico con un clic normal
#   {target}  Destino de la selección de idioma
#   {type}  Tipo de parámetro
#   {updated}  Mensajes cambiados por una actualización de idioma
#   {url}  URL pública del informe de diagnóstico
#   {value}  Valor actual, predeterminado o sin procesar
#   {variables}  Marcadores válidos para el mensaje seleccionado
#   {version}  Versión del plugin
#   {world}  Nombre del mundo

