# GamemodeSwitcher — ko_KR
#
# === 파일 편집 ===
# plugins/GamemodeSwitcher/languages/ko_KR.toml
# 이 파일을 직접 편집할 수 있습니다. 로컬 변경은 유지되며, 누락되거나 잘못된 항목에는 내장 영어를 사용합니다.
# /gsw language server edit ko_KR
#
# === 접두사 ===
# {prefix}  전역 runtime.prefix 값입니다. 개별 메시지에서 {prefix}를 제거하면 그 메시지에서만 숨겨집니다
#
# === 서식 ===
# 색상: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B, [RRGGBB]. 사용자 지정 서식에는 MiniMessage도 사용할 수 있습니다.
# & 또는 [ 앞에 백슬래시를 붙이면 문자를 그대로 표시합니다.
#
# === 변수 ===
# 변수 이름을 변경하지 말고 각 메시지에 원래 있는 변수만 사용하세요.
#   {after}  변경 후 가치
#   {argument}  예상하지 못한 인수
#   {before}  변경 전의 값
#   {command}  명령 경로
#   {count}  일치하는 항목의 수
#   {enabled}  게임 모드 전환 활성화 상태
#   {group}  언어 편집기 분류
#   {hot_reload}  핫 리로드 상태
#   {key}  매개변수 키
#   {language}  활성 언어
#   {line}  소스 라인 또는 라인 번호
#   {locale}  로케일
#   {maximum}  최대 허용 값
#   {mode}  게임 모드 이름
#   {new}  새 값
#   {number}  항목 번호
#   {old}  이전 값
#   {page}  현재 페이지 번호
#   {pages}  전체 페이지 수
#   {parameter}  매개변수 이름
#   {path}  로컬 보고서 경로
#   {permission}  필요한 권한
#   {personal}  개인 로케일
#   {plugin}  Plugin 이름
#   {prefix}  전역 runtime.prefix 값입니다. 개별 메시지에서 {prefix}를 제거하면 그 메시지에서만 숨겨집니다
#   {reason}  실패 이유
#   {scheduler}  스케줄러
#   {seconds}  남은 재사용 대기 또는 확인 시간(초)
#   {section}  언어 편집기 섹션
#   {setting}  설정 이름
#   {step}  일반 클릭 한 번으로 변경되는 수치
#   {sound}  소리 식별자
#   {state}  개인 동작 또는 알림 상태
#   {target}  대상 플레이어, 단체, 또는 가치
#   {type}  형식
#   {url}  공개 URL
#   {value}  현재값, 기본값 또는 원시값
#   {variables}  사용 가능한 자리표시자
#   {version}  플러그인 버전
#   {world}  월드

