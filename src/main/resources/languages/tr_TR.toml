[gui.config.restrictions.disabled-worlds]
name = "Devre dışı dünyalar"
description = "Hareketlerin, komutların ve menünün mod değiştiremediği dünya adları. Büyük ve küçük harfler eşdeğerdir."
input = "[\"world_nether\", \"world_the_end\"] gibi dünya adlarından oluşan bir liste kullanın. Dünya kısıtlaması olmaması için [] kullanın."

[gui.config.feedback.auto-fly-creative]
name = "Yaratıcıya geçince uç"
description = "Oyuncunun uçmasına izin veriliyorsa Yaratıcıya girdikten sonra uçmaya başlayın."

[gui.config.feedback.sound-enabled]
name = "Değiştirme sesi"
description = "Başarılı bir oyun modu değişikliğinden sonra onay sesi çalın."

[gui.config.diagnostics.upload-enabled]
name = "Herkese açık raporlar"
description = "Tanılama raporlarının herkese açık yüklenmesine izin verin. Yerel kayıt için upload=false kullanın."

[gui.config.feedback.chat-enabled]
name = "Sohbet mesajları"
description = "Başarılı değişiklikleri ve İzleyici ipuçlarını sohbette gösterin. Kapalıyken hata nedenleri eylem çubuğunda görünür."

[gui.config.feedback.action-bar-enabled]
name = "Eylem çubuğu bildirimi"
description = "Yeni modu hızlı erişim çubuğunun üstünde, İzleyicide çıkış ipucuyla gösterin."

[gui.config.feedback.title-enabled]
name = "Başlık bildirimi"
description = "Yeni modu ekranın ortasında, İzleyicide çıkış ipucuyla gösterin."

[gui.config.feedback.popup-duration-ticks]
name = "Bildirim süresi"
description = "Başlık ve eylem çubuğunun tik cinsinden süresi; 20 tik = 1 saniye. Aralık: 1 ile 200."

[gui.config.feedback.sound]
name = "Ses anahtarı"
description = "Başarılı oyun modu değişikliğinden sonra çalınacak ses."
input = "minecraft:ui.button.click veya minecraft:entity.experience_orb.pickup gibi ad alanlı bir ses anahtarı girin. Özel kaynak paketi anahtarlarına izin verilir."

[gui.config.feedback.sound-volume]
name = "Ses düzeyi"
description = "Değiştirme sesinin düzeyi. Aralık: 0 ile 1; 0 sessizdir."

[gui.config.feedback.sound-pitch]
name = "Ses perdesi"
description = "Değiştirme sesinin perdesi. Aralık: 0.5 ile 2; 1 özgün perdeyi kullanır."
