# GamemodeSwitcher — tr_TR
#
# === Dosyayı düzenleme ===
# plugins/GamemodeSwitcher/languages/tr_TR.toml
# Bu dosyayı doğrudan düzenleyebilirsiniz. Yerel değişiklikler korunur; eksik veya geçersiz girdiler yerleşik İngilizce metni kullanır.
# /gsw language server edit tr_TR
#
# === Önek ===
# {prefix}  genel runtime.prefix değeri. Yalnızca belirli bir iletide gizlemek için o iletiden {prefix} öğesini kaldırın
#
# === Biçimlendirme ===
# Renkler: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ve [RRGGBB]. Özel biçimlendirme için MiniMessage da kullanılabilir.
# & veya [ karakterini olduğu gibi göstermek için önüne ters eğik çizgi koyun.
#
# === Değişkenler ===
# Değişken adlarını değiştirmeyin ve yalnızca ilgili iletinin değişkenlerini kullanın.
#   {added}  Dil güncellemesiyle eklenen mesajlar
#   {after}  Değişiklikten sonraki değer
#   {argument}  Beklenmeyen komut argümanı
#   {before}  Değişiklikten önceki değer
#   {command}  Komut yolu
#   {count}  Eşleşen giriş sayısı
#   {enabled}  Oyun modu değiştirme durumu
#   {folder}  Dünya klasörü adı
#   {group}  Mesaj kategorisi adı
#   {hot_reload}  Otomatik dosya yeniden yükleme durumu
#   {java}  Gerekli Java sürümü
#   {kept}  Dil güncellemesinde korunan yerel düzenlemeler
#   {key}  Parametre veya mesaj anahtarı
#   {language}  Sunucu dili
#   {line}  Mesaj satır numarası
#   {locale}  Yerel ayar kimliği
#   {maximum}  Kabul edilen en yüksek değer
#   {minecraft}  Desteklenen Minecraft sürüm aralığı
#   {mode}  Oyun modu adı
#   {new}  Yeni ayar değeri
#   {number}  Liste girişi numarası
#   {old}  Önceki ayar değeri
#   {page}  Geçerli sayfa numarası
#   {pages}  Toplam sayfa sayısı
#   {parameter}  Parametre adı
#   {path}  Yerel tanılama raporu yolu
#   {permission}  Gerekli izin
#   {personal}  Sunucu varsayılanından farklıysa kişisel dil
#   {plugin}  Eklenti adı
#   {prefix}  Genel runtime.prefix değeri; her mesajda isteğe bağlı
#   {reason}  Hata nedeni
#   {remaining}  Bir sonraki dil denetimine izin verilene kadar kalan süre
#   {scheduler}  Zamanlayıcı uygulaması
#   {seconds}  Saniye cinsinden kalan bekleme veya onay süresi
#   {section}  Dil düzenleyicisi bölümü
#   {setting}  Ayar adı
#   {sound}  Ad alanlı ses kimliği
#   {state}  Oyuncu hareketi veya bildirim ayarı
#   {step}  Tek bir normal tıklamayla sayısal ayarda yapılan değişiklik
#   {target}  Dil seçimi hedefi
#   {type}  Parametre türü
#   {updated}  Dil güncellemesiyle değiştirilen mesajlar
#   {url}  Herkese açık tanılama raporu URL'si
#   {value}  Geçerli, varsayılan veya ham değer
#   {variables}  Seçilen mesaj için geçerli yer tutucular
#   {version}  Eklenti sürümü
#   {world}  Dünya adı

