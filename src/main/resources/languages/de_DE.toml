# GamemodeSwitcher — de_DE
#
# === Datei bearbeiten ===
# plugins/GamemodeSwitcher/languages/de_DE.toml
# Diese Datei kann direkt bearbeitet werden. Lokale Änderungen bleiben erhalten; fehlende oder ungültige Einträge verwenden das eingebaute Englisch.
# /gsw language server edit de_DE
#
# === Präfix ===
# {prefix}  der globale Wert runtime.prefix. Entferne {prefix} aus einer einzelnen Nachricht, um es dort auszublenden
#
# === Formatierung ===
# Farben: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B und [RRGGBB]. MiniMessage bleibt für eigene Formatierungen verfügbar.
# Ein vorangestellter Rückwärtsschrägstrich zeigt & oder [ wörtlich an.
#
# === Variablen ===
# Variablennamen unverändert lassen und nur die Variablen der jeweiligen Nachricht verwenden.
#   {added}  Durch eine Sprachaktualisierung hinzugefügte Nachrichten
#   {after}  Wert nach der Änderung
#   {argument}  Unerwartetes Befehlsargument
#   {before}  Wert vor der Änderung
#   {command}  Befehlspfad
#   {count}  Anzahl übereinstimmender Einträge
#   {enabled}  Status des Spielmoduswechsels
#   {folder}  Ordnername der Welt
#   {group}  Name der Nachrichtenkategorie
#   {hot_reload}  Status des automatischen Neuladens von Dateien
#   {java}  Erforderliche Java-Version
#   {kept}  Bei einer Sprachaktualisierung behaltene lokale Änderungen
#   {key}  Parameter- oder Nachrichtenschlüssel
#   {language}  Serversprache
#   {line}  Zeilennummer der Nachricht
#   {locale}  Sprachkennung
#   {maximum}  Zulässiger Höchstwert
#   {minecraft}  Unterstützter Minecraft-Versionsbereich
#   {mode}  Spielmodusname
#   {new}  Neuer Einstellungswert
#   {number}  Nummer des Eintrags
#   {old}  Vorheriger Einstellungswert
#   {page}  Aktuelle Seite
#   {pages}  Gesamtzahl der Seiten
#   {parameter}  Parametername
#   {path}  Lokaler Pfad des Diagnoseberichts
#   {permission}  erforderliche Berechtigung
#   {personal}  Persönliche Sprache, falls abweichend vom Serverstandard
#   {plugin}  Plugin-Name
#   {prefix}  Globaler Wert von runtime.prefix; pro Nachricht optional
#   {reason}  Fehlergrund
#   {remaining}  Verbleibende Wartezeit bis zur nächsten Sprachprüfung
#   {scheduler}  Scheduler-Implementierung
#   {seconds}  Verbleibende Abkling- oder Bestätigungszeit in Sekunden
#   {section}  Abschnitt des Spracheneditors
#   {setting}  Einstellungsname
#   {sound}  Soundkennung mit Namensraum
#   {state}  Gesten- oder Rückmeldungseinstellung des Spielers
#   {step}  Änderung eines Zahlenwerts durch einen normalen Klick
#   {target}  Ziel der Sprachauswahl
#   {type}  Parametertyp
#   {updated}  Durch eine Sprachaktualisierung geänderte Nachrichten
#   {url}  Öffentliche URL des Diagnoseberichts
#   {value}  aktueller, Standard- oder Rohwert
#   {variables}  Gültige Platzhalter für die ausgewählte Nachricht
#   {version}  Plugin-Version
#   {world}  Weltname

