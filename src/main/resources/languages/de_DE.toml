[gui.config.feedback.title-enabled]
name = "Titel-Popup"
description = "Den neuen Modus in der Bildschirmmitte anzeigen, im Zuschauermodus mit Hinweis zum Verlassen."

[gui.config.feedback.popup-duration-ticks]
name = "Popup-Dauer"
description = "Anzeigedauer von Titel und Aktionsleiste in Ticks; 20 Ticks = 1 Sekunde. Bereich: 1 bis 200."

[gui.config.feedback.sound]
name = "Soundkennung"
description = "Sound nach einem erfolgreichen Spielmoduswechsel."
input = "Eine Soundkennung mit Namensraum eingeben, etwa minecraft:ui.button.click oder minecraft:entity.experience_orb.pickup. Eigene Ressourcenpaket-Sounds sind erlaubt."

[gui.config.feedback.sound-volume]
name = "Lautstärke"
description = "Lautstärke des Wechselsounds. Bereich: 0 bis 1; 0 ist stumm."

[gui.config.feedback.sound-pitch]
name = "Tonhöhe"
description = "Tonhöhe des Wechselsounds. Bereich: 0.5 bis 2; 1 entspricht der Originaltonhöhe."

[sound.menu]
title = "<gradient:#634514:#2f523f>Wechselsound</gradient>"
current = "<gray>Aktueller Sound: {sound}</gray>"
select = "<gray>Linksklick zum Auswählen. Rechtsklick zum Anhören.</gray>"
selected = "<green>Ausgewählter Sound</green>"
preview = "<gold>Aktuellen Sound anhören</gold>"
preview-help = "<gray>Mit der aktuellen Serverlautstärke und Tonhöhe anhören, auch wenn Wechselsounds stummgeschaltet sind.</gray>"
custom = "<gold>Eigene Soundkennung</gold>"
custom-help = "<gray>Eine Minecraft- oder Ressourcenpaket-Soundkennung eingeben.</gray>"

[sound.preset]
click = "<gold>Tastenklick</gold>"
chime = "<gold>Glockenspiel</gold>"
pling = "<gold>Pling</gold>"
experience = "<gold>Erfahrung aufsammeln</gold>"
bell = "<gold>Glocke</gold>"

[spectator]
busy = "{prefix} &eEin Wechsel des Zuschauermodus läuft bereits.&r"
none = "{prefix} &eDu hast keine aktive Zuschauersitzung.&r"
return-failed = "{prefix}&cRückkehr fehlgeschlagen. Deine Sitzung ist gespeichert; versuche /gsw return erneut.&r"
save-failed = "{prefix} &cDeine Zuschauersitzung konnte nicht gespeichert werden. Dein Spielmodus wurde nicht geändert.&r"

[gui.config.spectator]
name = "Zuschauer-Rückkehr"
description = "Modus oder Position wiederherstellen, die beim Start einer Zuschauersitzung durch dieses Plugin gespeichert wurden."

[gui.config.spectator.restore-previous-mode]
name = "Vorherigen Modus wiederherstellen"
description = "Dreimal Schleichen oder /gsw return stellt den vorherigen Modus wieder her. Aktuelle Berechtigungen und Weltbeschränkungen gelten weiterhin."

[gui.config.spectator.return-to-origin]
name = "Zur Startposition zurückkehren"
description = "Vor dem Verlassen einer Plugin-Zuschauersitzung zur gespeicherten Startposition zurückkehren."

[gui.config.spectator.allow-unsafe-return]
name = "Unsichere Rückkehr erlauben"
description = "Ohne Boden- und Freiraumprüfung zurückkehren. Standardmäßig an; ausschalten für sichere Ziele. Gilt auch für laufende Sitzungen."
