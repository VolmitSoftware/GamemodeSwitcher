# GamemodeSwitcher — he_IL
#
# === עריכת הקובץ ===
# plugins/GamemodeSwitcher/languages/he_IL.toml
# אפשר לערוך קובץ זה ישירות. שינויים מקומיים נשמרים; ערכים חסרים או לא תקינים משתמשים באנגלית המובנית.
# /gsw language server edit he_IL
#
# === קידומת ===
# {prefix}  הערך הגלובלי runtime.prefix. הסירו את {prefix} מהודעה מסוימת כדי להסתיר אותה רק שם
#
# === עיצוב ===
# צבעים: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B וגם [RRGGBB]. ניתן להשתמש גם ב-MiniMessage לעיצוב מותאם.
# כדי להציג & או [ כלשונם, יש להוסיף לפניהם לוכסן הפוך.
#
# === משתנים ===
# יש לשמור על שמות המשתנים ולהשתמש רק במשתנים הקיימים בכל הודעה.
#   {added}  הודעות שנוספו בעדכון שפה
#   {after}  הערך לאחר השינוי
#   {argument}  ארגומנט פקודה לא צפוי
#   {before}  הערך לפני השינוי
#   {command}  נתיב הפקודה
#   {count}  מספר הרשומות התואמות
#   {enabled}  מצב החלפת מצבי המשחק
#   {folder}  שם תיקיית העולם
#   {group}  שם קטגוריית ההודעות
#   {hot_reload}  מצב הטעינה האוטומטית של הקבצים
#   {java}  גרסת Java הנדרשת
#   {kept}  עריכות מקומיות שנשמרו בעדכון שפה
#   {key}  מפתח פרמטר או הודעה
#   {language}  שפת השרת
#   {line}  מספר השורה בהודעה
#   {locale}  מזהה אזור השפה
#   {maximum}  הערך המרבי המותר
#   {minecraft}  טווח גרסאות Minecraft הנתמכות
#   {mode}  שם מצב המשחק
#   {new}  ערך ההגדרה החדש
#   {number}  מספר הרשומה ברשימה
#   {old}  ערך ההגדרה הקודם
#   {page}  מספר העמוד הנוכחי
#   {pages}  מספר העמודים הכולל
#   {parameter}  שם הפרמטר
#   {path}  הנתיב המקומי של דוח האבחון
#   {permission}  ההרשאה הנדרשת
#   {personal}  השפה האישית, כשהיא שונה מברירת המחדל של השרת
#   {plugin}  שם התוסף
#   {prefix}  הערך הגלובלי runtime.prefix; אופציונלי בכל הודעה
#   {reason}  סיבת הכשל
#   {remaining}  הזמן שנותר עד שתותר בדיקת השפות הבאה
#   {scheduler}  מימוש המתזמן
#   {seconds}  זמן ההמתנה או האישור שנותר בשניות
#   {section}  מקטע בעורך השפות
#   {setting}  שם ההגדרה
#   {sound}  מזהה הצליל עם מרחב שמות
#   {state}  הגדרת המחוות או ההתראות של השחקן
#   {step}  שינוי ההגדרה המספרית בלחיצה רגילה אחת
#   {target}  יעד בחירת השפה
#   {type}  סוג הפרמטר
#   {updated}  הודעות ששונו בעדכון שפה
#   {url}  הכתובת הציבורית של דוח האבחון
#   {value}  ערך נוכחי, ברירת מחדל או גולמי
#   {variables}  מצייני המקום התקפים להודעה שנבחרה
#   {version}  גרסת התוסף
#   {world}  שם העולם

