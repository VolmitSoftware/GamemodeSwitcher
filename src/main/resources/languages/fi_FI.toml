description = "Kohde hiivittäessä ja painettaessa käsien vaihtonäppäintä kahdesti pelitilassa Seikkailu."

[gui.config.restrictions.disabled-worlds]
name = "Estetyt maailmat"
description = "Maailmat, joissa eleet, komennot ja valikko eivät voi vaihtaa pelitilaa. Kirjainkoolla ei ole väliä."
input = "Anna maailmanimien luettelo, esimerkiksi [\"world_nether\", \"world_the_end\"]. [] poistaa maailmarajoitukset."

[gui.config.feedback.auto-fly-creative]
name = "Lennä luovaan siirryttäessä"
description = "Aloita lentäminen luovaan tilaan siirryttäessä, jos pelaaja saa lentää."

[gui.config.feedback.sound-enabled]
name = "Vaihdon ääni"
description = "Soita vahvistusääni onnistuneen pelitilan vaihdon jälkeen."

[gui.config.diagnostics.upload-enabled]
name = "Julkiset vianmääritysraportit"
description = "Salli vianmääritysraporttien julkinen lähetys. upload=false tallentaa raportin paikallisesti."

[gui.config.feedback.chat-enabled]
name = "Chat-viestit"
description = "Näytä onnistuneet vaihdot ja Katsojan ohjeet chatissa. Kun pois käytöstä, virheiden syyt näkyvät toimintapalkissa."

[gui.config.feedback.action-bar-enabled]
name = "Toimintapalkin ilmoitus"
description = "Näytä uusi tila pikapalkin yläpuolella sekä poistumisohje Katsojassa."

[gui.config.feedback.title-enabled]
name = "Otsikkoilmoitus"
description = "Näytä uusi tila ruudun keskellä sekä poistumisohje Katsojassa."

[gui.config.feedback.popup-duration-ticks]
name = "Ilmoituksen kesto"
description = "Otsikon ja toimintapalkin kesto tickeinä; 20 tickiä = 1 sekunti. Alue: 1-200."

[gui.config.feedback.sound]
name = "Äänen tunniste"
description = "Onnistuneen pelitilan vaihdon jälkeen soitettava ääni."
input = "Anna nimiavaruudellinen äänitunniste, kuten minecraft:ui.button.click tai minecraft:entity.experience_orb.pickup. Mukautettujen resurssipakettien tunnisteet sallitaan."

[gui.config.feedback.sound-volume]
name = "Äänenvoimakkuus"
description = "Vaihtoäänen voimakkuus. Alue: 0-1; 0 on äänetön."

[gui.config.feedback.sound-pitch]
name = "Äänenkorkeus"
description = "Vaihtoäänen korkeus. Alue: 0.5-2; 1 käyttää alkuperäistä korkeutta."

[sound.menu]
title = "<gradient:#634514:#2f523f>Vaihtoääni</gradient>"
current = "<gray>Nykyinen ääni: {sound}</gray>"
select = "<gray>Valitse vasemmalla painikkeella. Esikuuntele oikealla.</gray>"
selected = "<green>Valittu ääni</green>"
preview = "<gold>Esikuuntele nykyinen ääni</gold>"
preview-help = "<gray>Kuuntele palvelimen nykyisellä äänenvoimakkuudella ja sävelkorkeudella, vaikka vaihtoäänet olisi mykistetty.</gray>"
custom = "<gold>Oma äänitunnus</gold>"
custom-help = "<gray>Anna Minecraftin tai resurssipaketin äänitunnus.</gray>"

[sound.preset]
click = "<gold>Painikkeen napsahdus</gold>"
chime = "<gold>Kellopeli</gold>"
pling = "<gold>Pling</gold>"
experience = "<gold>Kokemuspisteen keräys</gold>"
bell = "<gold>Kello</gold>"

[spectator]
busy = "{prefix} &eTarkkailutilan vaihto on jo käynnissä.&r"
none = "{prefix} &eSinulla ei ole aktiivista tarkkailuistuntoa.&r"
return-failed = "{prefix}&cPaluu epäonnistui. Istuntosi on tallennettu; yritä /gsw return uudelleen.&r"
save-failed = "{prefix} &cTarkkailuistuntoa ei voitu tallentaa. Pelitilaasi ei muutettu.&r"

[gui.config.spectator]
name = "Paluu tarkkailusta"
description = "Palauta tila tai sijainti, joka tallennettiin tämän lisäosan aloittaessa tarkkailuistunnon."

[gui.config.spectator.restore-previous-mode]
name = "Palauta edellinen tila"
description = "Paina hiipimistä kolmesti tai käytä /gsw return palauttaaksesi aiemman tilan. Nykyisiä oikeuksia ja maailman rajoituksia noudatetaan."

[gui.config.spectator.return-to-origin]
name = "Palaa aloituspaikkaan"
description = "Palaa tallennettuun aloituspaikkaan ennen lisäosan aloittaman tarkkailijaistunnon päättymistä."

[gui.config.spectator.allow-unsafe-return]
name = "Salli turvaton paluu"
description = "Palaa tarkistamatta lattiaa tai vapaata tilaa. Oletuksena päällä; poista käytöstä vaatiaksesi turvallisen kohteen. Koskee myös käynnissä olevia istuntoja."
