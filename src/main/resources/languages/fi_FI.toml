# GamemodeSwitcher — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/GamemodeSwitcher/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /gsw language server edit fi_FI
#
# === Etuliite ===
# {prefix}  yleinen runtime.prefix-arvo. Poista {prefix} yksittäisestä viestistä piilottaaksesi sen siinä
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
# Näytä & tai [ kirjaimellisesti lisäämällä eteen kenoviiva.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {added}  Kielipäivityksen lisäämät viestit
#   {after}  Arvo muutoksen jälkeen
#   {argument}  Odottamaton komennon argumentti
#   {before}  Arvo ennen muutosta
#   {command}  Komennon polku
#   {count}  Vastaavien kohteiden määrä
#   {enabled}  Pelitilan vaihtamisen tila
#   {folder}  Maailmakansion nimi
#   {group}  Viestiluokan nimi
#   {hot_reload}  Tiedostojen automaattisen uudelleenlatauksen tila
#   {java}  Vaadittu Java-versio
#   {kept}  Kielipäivityksessä säilytetyt paikalliset muokkaukset
#   {key}  Parametrin tai viestin avain
#   {language}  Palvelimen kieli
#   {line}  Viestin rivinumero
#   {locale}  Kielitunnus
#   {maximum}  Suurin sallittu arvo
#   {minecraft}  Tuettu Minecraft-versioväli
#   {mode}  Pelitilan nimi
#   {new}  Asetuksen uusi arvo
#   {number}  Kohdan numero
#   {old}  Asetuksen edellinen arvo
#   {page}  Nykyinen sivu
#   {pages}  Sivujen kokonaismäärä
#   {parameter}  Parametrin nimi
#   {path}  Paikallisen vianmääritysraportin polku
#   {permission}  Vaadittu käyttöoikeus
#   {personal}  Oma kieli, jos se eroaa palvelimen oletuksesta
#   {plugin}  Lisäosan nimi
#   {prefix}  Yleinen runtime.prefix-arvo; valinnainen viestikohtaisesti
#   {reason}  Virheen syy
#   {remaining}  Aika seuraavaan sallittuun kielitarkistukseen
#   {scheduler}  Ajastimen toteutus
#   {seconds}  Jäljellä oleva odotus- tai vahvistusaika sekunteina
#   {section}  Kielieditorin osio
#   {setting}  Asetuksen nimi
#   {sound}  Nimiavaruudellinen äänitunniste
#   {state}  Pelaajan ele- tai ilmoitusasetus
#   {step}  Lukuarvon muutos yhdellä tavallisella napsautuksella
#   {target}  Kielivalinnan kohde
#   {type}  Parametrin tyyppi
#   {updated}  Kielipäivityksen muuttamat viestit
#   {url}  Vianmääritysraportin julkinen URL
#   {value}  Nykyinen, oletus- tai raaka-arvo
#   {variables}  Valitun viestin sallitut paikkamerkit
#   {version}  Lisäosan versio
#   {world}  Maailman nimi

