# GamemodeSwitcher — fi_FI
#
# === Tiedoston muokkaus ===
# plugins/GamemodeSwitcher/languages/fi_FI.toml
# Voit muokata tätä tiedostoa suoraan. Paikalliset muutokset säilyvät; puuttuvat tai virheelliset kohdat käyttävät sisäänrakennettua englantia.
# /gsw language server edit fi_FI
#
# === Etuliite ===
# {prefix}  yleinen runtime.prefix-arvo. Poista {prefix} yksittäisestä viestistä piilottaaksesi sen siinä
#
# === Muotoilu ===
# Värit: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ja [RRGGBB]. MiniMessage toimii myös omissa muotoiluissa.
# Näytä & tai [ kirjaimellisesti lisäämällä eteen kenoviiva.
#
# === Muuttujat ===
# Säilytä muuttujien nimet ja käytä vain kunkin viestin omia muuttujia.
#   {after}  Arvo muutoksen jälkeen
#   {argument}  odottamaton argumentti
#   {before}  Arvo ennen muutosta
#   {command}  komentopolku
#   {count}  Täsmäytysten lukumäärä
#   {enabled}  Pelitilan vaihtamisen tila
#   {group}  Kielieditorin luokka
#   {hot_reload}  pikalatauksen tila
#   {key}  parametriavain
#   {language}  aktiivinen kieli
#   {line}  Lähderivi tai viivanumero
#   {locale}  kielitunnus
#   {maximum}  Suurin sallittu arvo
#   {mode}  Pelitilan nimi
#   {new}  uusi arvo
#   {number}  Kohdan numero
#   {old}  edellinen arvo
#   {page}  Nykyinen sivu
#   {pages}  Sivujen kokonaismäärä
#   {parameter}  parametrin nimi
#   {path}  paikallisen raportin polku
#   {permission}  vaadittu käyttöoikeus
#   {personal}  henkilökohtainen kielitunnus
#   {plugin}  Liitännäisen nimi
#   {prefix}  yleinen runtime.prefix-arvo. Poista {prefix} yksittäisestä viestistä piilottaaksesi sen siinä
#   {reason}  virheen syy
#   {scheduler}  ajastin
#   {seconds}  Jäljellä oleva odotus- tai vahvistusaika sekunteina
#   {section}  Kielieditorin osio
#   {setting}  asetuksen nimi
#   {step}  Lukuarvon muutos yhdellä tavallisella napsautuksella
#   {sound}  äänen tunnus
#   {state}  Omien eleiden tai ilmoitusten tila
#   {target}  Kohdepelaaja, yhteisö tai arvo
#   {type}  tyyppi
#   {url}  julkinen URL
#   {value}  nykyinen, oletus- tai raaka-arvo
#   {variables}  sallitut paikkamerkit
#   {version}  lisäosan versio
#   {world}  maailma

