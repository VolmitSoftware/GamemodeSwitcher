# GamemodeSwitcher — pl_PL
#
# === Edycja pliku ===
# plugins/GamemodeSwitcher/languages/pl_PL.toml
# Ten plik można edytować bezpośrednio. Lokalne zmiany są zachowywane; brakujące lub nieprawidłowe wpisy korzystają z wbudowanego angielskiego tekstu.
# /gsw language server edit pl_PL
#
# === Prefiks ===
# {prefix}  globalna wartość runtime.prefix. Usuń {prefix} z pojedynczej wiadomości, aby ukryć go tylko tam
#
# === Formatowanie ===
# Kolory: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B i [RRGGBB]. MiniMessage pozostaje dostępny dla własnego formatowania.
# Dodaj ukośnik odwrotny przed & lub [, aby wyświetlić znak dosłownie.
#
# === Zmienne ===
# Zachowaj nazwy zmiennych i używaj tylko tych, które występują w danej wiadomości.
#   {added}  Wiadomości dodane przez aktualizację języka
#   {after}  Wartość po zmianie
#   {argument}  Nieoczekiwany argument polecenia
#   {before}  Wartość przed zmianą
#   {command}  Ścieżka polecenia
#   {count}  Liczba pasujących wpisów
#   {enabled}  Stan przełączania trybu gry
#   {folder}  Nazwa folderu świata
#   {group}  Nazwa kategorii wiadomości
#   {hot_reload}  Stan automatycznego przeładowania plików
#   {java}  Wymagana wersja Javy
#   {kept}  Lokalne edycje zachowane przez aktualizację języka
#   {key}  Klucz parametru lub wiadomości
#   {language}  Język serwera
#   {line}  Numer linii wiadomości
#   {locale}  Identyfikator języka
#   {maximum}  Maksymalna dopuszczalna wartość
#   {minecraft}  Obsługiwany zakres wersji Minecrafta
#   {mode}  Nazwa trybu gry
#   {new}  Nowa wartość ustawienia
#   {number}  Numer wpisu na liście
#   {old}  Poprzednia wartość ustawienia
#   {page}  Numer bieżącej strony
#   {pages}  Łączna liczba stron
#   {parameter}  Nazwa parametru
#   {path}  Lokalna ścieżka raportu diagnostycznego
#   {permission}  Wymagane uprawnienie
#   {personal}  Osobisty język, jeśli różni się od domyślnego języka serwera
#   {plugin}  Nazwa wtyczki
#   {prefix}  Globalna wartość runtime.prefix; opcjonalna w każdej wiadomości
#   {reason}  Przyczyna niepowodzenia
#   {remaining}  Czas do kolejnego dozwolonego sprawdzenia języków
#   {scheduler}  Implementacja harmonogramu
#   {seconds}  Pozostały czas oczekiwania lub potwierdzenia w sekundach
#   {section}  Sekcja edytora języków
#   {setting}  Nazwa ustawienia
#   {sound}  Identyfikator dźwięku z przestrzenią nazw
#   {state}  Ustawienie gestów lub powiadomień gracza
#   {step}  Zmiana ustawienia liczbowego jednym zwykłym kliknięciem
#   {target}  Cel wyboru języka
#   {type}  Typ parametru
#   {updated}  Wiadomości zmienione przez aktualizację języka
#   {url}  Publiczny adres URL raportu diagnostycznego
#   {value}  Wartość bieżąca, domyślna lub surowa
#   {variables}  Zmienne dozwolone w wybranej wiadomości
#   {version}  Wersja wtyczki
#   {world}  Nazwa świata

