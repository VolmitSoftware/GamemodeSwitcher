# GamemodeSwitcher — zh_TW
#
# === 編輯檔案 ===
# plugins/GamemodeSwitcher/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /gsw language server edit zh_TW
#
# === 前綴 ===
# {prefix}  全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴
#
# === 格式 ===
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
# 在 & 或 [ 前加上反斜線可按原樣顯示該字元。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {added}  語言更新新增的訊息
#   {after}  變更後的值
#   {argument}  非預期的指令引數
#   {before}  變更前的值
#   {command}  指令路徑
#   {count}  符合的項目數
#   {enabled}  遊戲模式切換狀態
#   {folder}  世界資料夾名稱
#   {group}  訊息類別名稱
#   {hot_reload}  檔案自動重新載入狀態
#   {java}  所需 Java 版本
#   {kept}  語言更新保留的本機修改
#   {key}  參數或訊息鍵
#   {language}  伺服器語言
#   {line}  訊息行號
#   {locale}  地區識別碼
#   {maximum}  可接受的最大值
#   {minecraft}  支援的 Minecraft 版本範圍
#   {mode}  遊戲模式名稱
#   {new}  新設定值
#   {number}  清單項目編號
#   {old}  原設定值
#   {page}  目前頁碼
#   {pages}  總頁數
#   {parameter}  參數名稱
#   {path}  本機診斷報告路徑
#   {permission}  所需權限
#   {personal}  與伺服器預設語言不同時的個人語言
#   {plugin}  外掛名稱
#   {prefix}  全域 runtime.prefix 值；各訊息中可省略
#   {reason}  失敗原因
#   {remaining}  距下次可檢查語言的剩餘時間
#   {scheduler}  排程器實作
#   {seconds}  剩餘冷卻或確認時間（秒）
#   {section}  語言編輯器區段
#   {setting}  設定名稱
#   {sound}  含命名空間的音效識別碼
#   {state}  玩家手勢或回饋設定
#   {step}  一次普通點擊改變的數值
#   {target}  語言選擇目標
#   {type}  參數類型
#   {updated}  語言更新變更的訊息
#   {url}  公開診斷報告網址
#   {value}  目前值、預設值或原始值
#   {variables}  所選訊息可用的預留位置
#   {version}  外掛版本
#   {world}  世界名稱

