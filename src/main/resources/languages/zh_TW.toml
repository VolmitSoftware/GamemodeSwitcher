# GamemodeSwitcher — zh_TW
#
# === 編輯檔案 ===
# plugins/GamemodeSwitcher/languages/zh_TW.toml
# 可直接編輯此檔案。本機修改會保留；缺少或無效的項目使用內建英文文字。
# /gsw language server edit zh_TW
#
# === 前綴 ===
# {prefix}  全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴
#
# === 格式 ===
# 顏色：&0-&f、&k-&r、&#RRGGBB、&xRRGGBB、&x&R&R&G&G&B&B 和 [RRGGBB]。自訂格式仍可使用 MiniMessage。
# 在 & 或 [ 前加上反斜線可按原樣顯示該字元。
#
# === 變數 ===
# 請勿變更變數名稱，僅使用各訊息中原有的變數。
#   {after}  變更后的值
#   {argument}  意外引數
#   {before}  變更前的值
#   {command}  指令路徑
#   {count}  匹配項目數量
#   {enabled}  遊戲模式切換的啟用狀態
#   {group}  語言編輯器類別
#   {hot_reload}  熱重載狀態
#   {key}  參數鍵
#   {language}  目前語言
#   {line}  來源行或行號
#   {locale}  地區設定
#   {maximum}  最大允許值
#   {mode}  遊戲模式名稱
#   {new}  新值
#   {number}  項目編號
#   {old}  舊值
#   {page}  目前頁碼
#   {pages}  總頁數
#   {parameter}  參數名稱
#   {path}  本機報告路徑
#   {permission}  所需權限
#   {personal}  個人地區設定
#   {plugin}  插件名稱
#   {prefix}  全域 runtime.prefix 值。從個別訊息中移除 {prefix}，即可只在該處隱藏前綴
#   {reason}  失敗原因
#   {sound}  聲音識別碼
#   {scheduler}  排程器
#   {seconds}  剩餘冷卻或確認時間（秒）
#   {section}  語言編輯器區段
#   {setting}  設定名稱
#   {step}  一次普通點擊所改變的數值
#   {state}  個人手勢或通知狀態
#   {target}  目標播放器、 實體或值
#   {type}  類型
#   {url}  公開報告網址
#   {value}  目前值、預設值或原始值
#   {variables}  可用佔位符
#   {version}  外掛程式版本
#   {world}  世界

