# GamemodeSwitcher — lt_LT
#
# === Failo redagavimas ===
# plugins/GamemodeSwitcher/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojama integruota anglų kalba.
# /gsw language server edit lt_LT
#
# === Priešdėlis ===
# {prefix}  visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų
#
# === Formatavimas ===
# Spalvos: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ir [RRGGBB]. Pasirinktiniam formatavimui galima naudoti MiniMessage.
# Norėdami & arba [ rodyti tiesiogiai, prieš juos rašykite pasvirąjį brūkšnį atgal.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {after}  Vertė po pakeitimo
#   {argument}  netikėtas argumentas
#   {before}  Vertė prieš pakeitimą
#   {command}  komandos kelias
#   {count}  Atitinkamų įrašų skaičius
#   {enabled}  Žaidimo režimo keitimo būsena
#   {group}  Kalbos rengyklės kategorija
#   {hot_reload}  karštojo įkėlimo būsena
#   {key}  parametro raktas
#   {language}  aktyvi kalba
#   {line}  Pradinės eilutės arba eilutės numeris
#   {locale}  lokalė
#   {maximum}  Didžiausia leidžiama vertė
#   {mode}  Žaidimo režimo pavadinimas
#   {new}  nauja reikšmė
#   {number}  Įrašo numeris
#   {old}  ankstesnė reikšmė
#   {page}  Dabartinis puslapis
#   {pages}  Bendras puslapių skaičius
#   {parameter}  parametro vardas
#   {path}  vietinio pranešimo kelias
#   {permission}  reikalingas leidimas
#   {personal}  asmeninė lokalė
#   {plugin}  Įskiepio pavadinimas
#   {prefix}  visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų
#   {reason}  klaidos priežastis
#   {sound}  Garso identifikatorius
#   {scheduler}  planavimo sistema
#   {seconds}  Likęs laukimo arba patvirtinimo laikas sekundėmis
#   {section}  Kalbų redaktoriaus skiltis
#   {setting}  nuostatos vardas
#   {step}  Skaitinio nustatymo pokytis vienu įprastu spustelėjimu
#   {state}  Asmeninė gestų arba pranešimų būsena
#   {target}  Tikslinis žaidėjas, subjektas arba vertė
#   {type}  tipas
#   {url}  viešas URL
#   {value}  dabartinė, numatytoji arba neapdorota reikšmė
#   {variables}  galimi vietos žymekliai
#   {version}  įskiepio versija
#   {world}  pasaulis

