description = "Nustatyti paspaudimų laiką, laukimo laiką ir gestų tikslus."

[gui.config.gestures.normal]
name = "Dvigubo paspaudimo tikslai"
description = "Pasirinkti, kur dvigubas rankų sukeitimo klavišo paspaudimas nukelia iš kiekvieno žaidimo režimo."

[gui.config.gestures.sneaking]
name = "Sėlinimo tikslai"
description = "Pasirinkti, kur sėlinimas dukart paspaudžiant rankų sukeitimo klavišą nukelia iš kiekvieno žaidimo režimo."

[gui.config.restrictions]
name = "Pasaulių apribojimai"
description = "Pasirinkti pasaulius, kuriuose žaidimo režimo keitimas nepasiekiamas."

[gui.config.feedback]
name = "Keitimo pranešimai"
description = "Pasirinkti keitimo žinutes, iššokančius pranešimus, garsus ir skrydžio elgseną kūrybiniame režime."

[gui.config.diagnostics]
name = "Diagnostika"
description = "Valdyti diagnostikos ataskaitų viešą įkėlimą."

[gui.config.languages]
name = "Kalbos"
description = "Redaguoti serverio vertimus ir jų formatavimą."

[gui.config.general.enabled]
name = "Žaidimo režimo keitimas"
description = "Leisti keisti režimą gestais, komandomis ir meniu."

[gui.config.general.language]
name = "Serverio kalba"
description = "Numatytoji kalba žaidėjams be asmeninio pasirinkimo. Trūkstami vertimai pateikiami anglų kalba."

[gui.config.metrics.enabled]
name = "Anoniminė statistika"
description = "Siųsti anoniminę bStats statistiką. Taip pat galioja visuotinis bStats atsisakymas."

[gui.config.gestures.double-tap-millis]
name = "Dvigubo paspaudimo laikas"
description = "Didžiausias laikas tarp rankų sukeitimo paspaudimų milisekundėmis. Ribos: nuo 100 iki 3000."

[gui.config.gestures.sneak-tap-millis]
name = "Stebėtojo režimo paspaudimų laikas"
description = "Didžiausias laikas tarp sėlinimo paspaudimų stebėtojo režime milisekundėmis. Ribos: nuo 100 iki 3000."

[gui.config.gestures.cooldown-millis]
name = "Keitimo laukimo laikas"
description = "Laukimas po sėkmingo režimo keitimo milisekundėmis. Ribos: nuo 0 iki 60000; 0 pašalina laukimą."

[gui.config.gestures.require-empty-hands]
name = "Reikalauti tuščių rankų"
description = "Reikalauti, kad abi rankos būtų tuščios prieš keičiant režimą gestu."

[gui.config.gestures.spectator-exit]
name = "Režimas išėjus iš stebėtojo"
description = "Tikslas po trijų atskirų sėlinimo paspaudimų stebėtojo režime."

[gui.config.gestures.normal.survival]
name = "Iš išlikimo režimo"
description = "Tikslas, kai dukart paspaudžiate rankų sukeitimo klavišą išlikimo režime."

[gui.config.gestures.normal.creative]
name = "Iš kūrybinio režimo"
description = "Tikslas, kai dukart paspaudžiate rankų sukeitimo klavišą kūrybiniame režime."

[gui.config.gestures.normal.adventure]
name = "Iš nuotykių režimo"
description = "Tikslas, kai dukart paspaudžiate rankų sukeitimo klavišą nuotykių režime."

[gui.config.gestures.sneaking.survival]
name = "Iš išlikimo režimo"
description = "Tikslas, kai sėlinate ir dukart paspaudžiate rankų sukeitimo klavišą išlikimo režime."

[gui.config.gestures.sneaking.creative]
name = "Iš kūrybinio režimo"
description = "Tikslas, kai sėlinate ir dukart paspaudžiate rankų sukeitimo klavišą kūrybiniame režime."

[gui.config.gestures.sneaking.adventure]
name = "Iš nuotykių režimo"
description = "Tikslas, kai sėlinate ir dukart paspaudžiate rankų sukeitimo klavišą nuotykių režime."

[gui.config.restrictions.disabled-worlds]
name = "Išjungti pasauliai"
description = "Pasauliai, kuriuose gestai, komandos ir meniu negali pakeisti žaidimo režimo. Spustelėkite, kad pasirinktumėte iš sąrašo."

[gui.config.feedback.auto-fly-creative]
name = "Skristi įjungus kūrybinį režimą"
description = "Pradėti skristi įjungus kūrybinį režimą, jei žaidėjui leidžiama skristi."

[gui.config.feedback.sound-enabled]
name = "Keitimo garsas"
description = "Leisti patvirtinimo garsą po sėkmingo režimo keitimo."

[gui.config.diagnostics.upload-enabled]
name = "Viešas diagnostikos įkėlimas"
description = "Leisti viešai įkelti diagnostikos ataskaitas. Naudokite upload=false, kad ataskaita būtų išsaugota vietoje."

[gui.config.feedback.chat-enabled]
name = "Pokalbio pranešimai"
description = "Rodyti sėkmingus keitimus ir stebėtojo režimo patarimus pokalbyje. Išjungus nesėkmių priežastys rodomos veiksmų juostoje."

[gui.config.feedback.action-bar-enabled]
name = "Veiksmų juostos pranešimas"
description = "Rodyti naują režimą virš daiktų juostos, o stebėtojo režime – ir išėjimo patarimą."

[gui.config.feedback.title-enabled]
name = "Antraštės pranešimas"
description = "Rodyti naują režimą ekrano centre, o stebėtojo režime – ir išėjimo patarimą."

[gui.config.feedback.popup-duration-ticks]
name = "Pranešimų trukmė"
description = "Antraštės ir veiksmų juostos trukmė tikais; 20 tikų = 1 sekundė. Ribos: nuo 1 iki 200."

[gui.config.feedback.sound]
name = "Garso raktas"
description = "Garsas, grojamas po sėkmingo žaidimo režimo keitimo."
input = "Įveskite garso raktą su vardų sritimi, pavyzdžiui, minecraft:ui.button.click arba minecraft:entity.experience_orb.pickup. Leidžiami pasirinktinių išteklių paketų raktai."

[gui.config.feedback.sound-volume]
name = "Garso garsumas"
description = "Keitimo garso garsumas. Ribos: nuo 0 iki 1; 0 yra tyla."

[gui.config.feedback.sound-pitch]
name = "Garso aukštis"
description = "Keitimo garso aukštis. Ribos: nuo 0.5 iki 2; 1 naudoja pradinį aukštį."

