[gui.config.spectator.restore-previous-mode]
description = "Tris kartus sėlinkite arba naudokite /gsw return, kad atkurtumėte režimą, iš kurio įjungėte stebėtojo režimą. Dabartiniai leidimai ir pasaulių apribojimai vis tiek galioja."
name = "Atkurti ankstesnį režimą"

[gui.config.spectator.return-to-origin]
description = "Prieš išeinant iš papildinio pradėtos stebėtojo režimo sesijos, grįžti į išsaugotą įėjimo vietą."
name = "Grįžti į pradinę vietą"

