# GamemodeSwitcher — lt_LT
#
# === Failo redagavimas ===
# plugins/GamemodeSwitcher/languages/lt_LT.toml
# Šį failą galima redaguoti tiesiogiai. Vietiniai pakeitimai išsaugomi; trūkstamiems ar netinkamiems įrašams naudojama integruota anglų kalba.
# /gsw language server edit lt_LT
#
# === Priešdėlis ===
# {prefix}  visuotinė runtime.prefix reikšmė. Pašalinkite {prefix} iš atskiro pranešimo, kad jame jo nerodytų
#
# === Formatavimas ===
# Spalvos: &0-&f, &k-&r, &#RRGGBB, &xRRGGBB, &x&R&R&G&G&B&B ir [RRGGBB]. Pasirinktiniam formatavimui galima naudoti MiniMessage.
# Norėdami & arba [ rodyti tiesiogiai, prieš juos rašykite pasvirąjį brūkšnį atgal.
#
# === Kintamieji ===
# Nekeiskite kintamųjų pavadinimų ir naudokite tik konkrečiame pranešime esančius kintamuosius.
#   {added}  Kalbos atnaujinimo pridėti pranešimai
#   {after}  Vertė po pakeitimo
#   {argument}  Netikėtas komandos argumentas
#   {before}  Vertė prieš pakeitimą
#   {command}  Komandos kelias
#   {count}  Atitinkamų įrašų skaičius
#   {enabled}  Žaidimo režimo keitimo būsena
#   {folder}  Pasaulio aplanko pavadinimas
#   {group}  Pranešimų kategorijos pavadinimas
#   {hot_reload}  Automatinio failų įkėlimo iš naujo būsena
#   {java}  Reikalinga Java versija
#   {kept}  Kalbos atnaujinimo išsaugoti vietiniai pakeitimai
#   {key}  Parametro arba pranešimo raktas
#   {language}  Serverio kalba
#   {line}  Pranešimo eilutės numeris
#   {locale}  Lokalės identifikatorius
#   {maximum}  Didžiausia leidžiama vertė
#   {minecraft}  Palaikomų Minecraft versijų intervalas
#   {mode}  Žaidimo režimo pavadinimas
#   {new}  Nauja nustatymo reikšmė
#   {number}  Sąrašo įrašo numeris
#   {old}  Ankstesnė nustatymo reikšmė
#   {page}  Dabartinio puslapio numeris
#   {pages}  Bendras puslapių skaičius
#   {parameter}  Parametro pavadinimas
#   {path}  Vietinės diagnostikos ataskaitos kelias
#   {permission}  Reikalingas leidimas
#   {personal}  Asmeninė kalba, jei ji skiriasi nuo numatytosios serverio kalbos
#   {plugin}  Papildinio pavadinimas
#   {prefix}  Visuotinė runtime.prefix reikšmė; pasirenkama kiekviename pranešime
#   {reason}  Nesėkmės priežastis
#   {remaining}  Laikas iki kito leidžiamo kalbų tikrinimo
#   {scheduler}  Planuoklio realizacija
#   {seconds}  Likęs laukimo arba patvirtinimo laikas sekundėmis
#   {section}  Kalbų rengyklės skiltis
#   {setting}  Nustatymo pavadinimas
#   {sound}  Garso identifikatorius su vardų sritimi
#   {state}  Žaidėjo gestų arba pranešimų nustatymas
#   {step}  Skaitinio nustatymo pokytis vienu įprastu spustelėjimu
#   {target}  Kalbos pasirinkimo paskirtis
#   {type}  Parametro tipas
#   {updated}  Kalbos atnaujinimo pakeisti pranešimai
#   {url}  Viešas diagnostikos ataskaitos URL
#   {value}  Dabartinė, numatytoji arba neapdorota reikšmė
#   {variables}  Pasirinktam pranešimui galimi kintamieji
#   {version}  Papildinio versija
#   {world}  Pasaulio pavadinimas

