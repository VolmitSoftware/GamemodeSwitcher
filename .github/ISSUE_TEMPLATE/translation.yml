name: Translation or wording
description: A message in GamemodeSwitcher is mistranslated, missing, unclear, or misspelled.
labels: [translation]
body:
  - type: markdown
    attributes:
      value: |
        The catalogs live in [`src/main/resources/languages/`](https://github.com/VolmitSoftware/GamemodeSwitcher/tree/HEAD/src/main/resources/languages) in this repository. A pull request that edits the `<locale>.toml` file there is the fastest fix; use this form if you would rather describe the change.

        Editing the language file on your own server changes only your copy. See [Languages](https://docs.volmitsoftware.com/languages) for how the files work.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English (en_US)
        - German (de_DE)
        - Spanish (es_ES)
        - Finnish (fi_FI)
        - French (fr_FR)
        - Hebrew (he_IL)
        - Italian (it_IT)
        - Japanese (ja-JP)
        - Korean (ko_KR)
        - Lithuanian (lt_LT)
        - Dutch (nl_NL)
        - Polish (pl_PL)
        - Portuguese (pt_PT)
        - Russian (ru_RU)
        - Turkish (tr_TR)
        - Vietnamese (vi_VI)
        - Chinese, Simplified (zh_CN)
        - Chinese, Traditional (zh_TW)
        - Another language (name it below)
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Message key
      description: The key from the language file, if you found it.
      placeholder: command.feedback.version
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Copy the text as it appears in game or in the file.
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: Keep placeholders such as `{player}` and MiniMessage tags such as `<gold>` exactly as they are.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it appears
      description: The command, menu, or event that shows the message. A screenshot helps.
  - type: input
    id: plugin-version
    attributes:
      label: "GamemodeSwitcher version"
    validations:
      required: true
