name: Translation
description: A message in GamemodeSwitcher is wrong, missing, or unclear.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The language files are in [`src/main/resources/languages/`](https://github.com/VolmitSoftware/GamemodeSwitcher/tree/HEAD/src/main/resources/languages). You can also fix the text with a pull request.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English (en_US)
        - German (de_DE)
        - Spanish (es_ES)
        - Finnish (fi_FI)
        - French (fr_FR)
        - Hebrew (he_IL)
        - Italian (it_IT)
        - Japanese (ja-JP)
        - Korean (ko_KR)
        - Lithuanian (lt_LT)
        - Dutch (nl_NL)
        - Polish (pl_PL)
        - Portuguese (pt_PT)
        - Russian (ru_RU)
        - Turkish (tr_TR)
        - Vietnamese (vi_VI)
        - Chinese, Simplified (zh_CN)
        - Chinese, Traditional (zh_TW)
        - Other
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
      description: Keep placeholders like `{player}` and tags like `<gold>` as they are.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where does it appear?
      description: The command or menu, or the message key if you know it.
