name: Bug report
description: Something in GamemodeSwitcher isn't working.
labels: [bug]
type: Bug
assignees: [SwiftSwamp]
body:
  - type: markdown
    attributes:
      value: |
        Make sure you're on the [latest release](https://github.com/VolmitSoftware/GamemodeSwitcher/releases/latest) and that it hasn't [already been reported](https://github.com/VolmitSoftware/GamemodeSwitcher/issues?q=is%3Aissue).

        GamemodeSwitcher supports Minecraft 26.1 through 26.3 on Spigot, Paper, Purpur, Leaf, Folia, and Canvas, with Java 25.
  - type: textarea
    id: issue
    attributes:
      label: What issue are you having?
      description: Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a server with GamemodeSwitcher installed
        2. Change ... in the config
        3. Run /gamemodeswitcher ...
        4. ... happens instead of ...
    validations:
      required: true
  - type: input
    id: diagnostics
    attributes:
      label: Debug dump or latest log file
      description: Run `/gamemodeswitcher debug dump upload=true` and paste the link. If GamemodeSwitcher won't start, upload `logs/latest.log` to [mclo.gs](https://mclo.gs) and paste that link instead.
      placeholder: https://mclo.gs/...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: "GamemodeSwitcher version"
      description: Run `/gamemodeswitcher debug version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Server software
      options:
        - "Spigot"
        - "Paper"
        - "Purpur"
        - "Leaf"
        - "Folia"
        - "Canvas"
        - Other (unsupported)
    validations:
      required: true
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "26.2"
        - "26.1"
        - Other (unsupported)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Other plugins involved, screenshots, or videos.
