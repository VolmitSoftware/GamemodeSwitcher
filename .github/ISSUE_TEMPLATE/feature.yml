name: Suggestion
description: Suggest a new feature or a change to GamemodeSwitcher.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [existing suggestions](https://github.com/VolmitSoftware/GamemodeSwitcher/issues?q=is%3Aissue+label%3Aenhancement) first. If yours is already there, add a thumbs-up to it instead. One idea per issue.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: Commands, settings, or menus you have in mind.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Workarounds you use today, examples, or screenshots.
